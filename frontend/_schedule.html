function employeeTodayKey_(){
  const now=new Date();
  return now.getFullYear()+'-'+
    String(now.getMonth()+1).padStart(2,'0')+'-'+
    String(now.getDate()).padStart(2,'0');
}

function buildScheduleTimeOptionsV33_(id){
  const select=document.getElementById(id);
  if(!select)return;

  let html='<option value="">Chọn giờ</option>';

  for(let hour=0;hour<24;hour++){
    for(let minute of [0,30]){
      const value=
        String(hour).padStart(2,'0')+':' +
        String(minute).padStart(2,'0');

      html +=
        '<option value="'+
        escapeClientHtml(value)+
        '">'+
        escapeClientHtml(value)+
        '</option>';
    }
  }

  select.innerHTML=html;
}

function loadScheduleStoreOptionsV33_(){
  const select=document.getElementById('shiftStore');
  if(!select)return;

  google.script.run
    .withSuccessHandler(function(r){
      if(!r||!r.ok){
        select.innerHTML='<option value="">Không tải được cửa hàng</option>';
        return;
      }

      const stores=Array.isArray(r.stores)?r.stores:[];

      select.innerHTML=
        '<option value="">Chọn cửa hàng</option>'+
        stores.map(function(store){
          const safe=escapeClientHtml(store);
          return '<option value="'+safe+'">'+safe+'</option>';
        }).join('');

      if(stores.length===1)select.value=stores[0];
    })
    .withFailureHandler(function(){
      select.innerHTML='<option value="">Không tải được cửa hàng</option>';
    })
    .getAttendanceOptions(currentSessionToken);
}

function submitEmployeeScheduleRegistrationV33_(btn){
  const msg=document.getElementById('scheduleMsg');

  const data={
    date:document.getElementById('shiftDate')?.value||'',
    start:document.getElementById('shiftStart')?.value||'',
    end:document.getElementById('shiftEnd')?.value||'',
    store:document.getElementById('shiftStore')?.value||''
  };

  if(!data.date||!data.start||!data.end||!data.store){
    if(msg){
      msg.textContent='Vui lòng chọn đủ ngày, giờ bắt đầu, giờ kết thúc và cửa hàng.';
      msg.style.color='#c2414a';
    }
    return;
  }

  if(data.end<=data.start){
    if(msg){
      msg.textContent='Giờ kết thúc phải lớn hơn giờ bắt đầu.';
      msg.style.color='#c2414a';
    }
    return;
  }

  btn.disabled=true;
  btn.textContent='Đang gửi…';

  google.script.run
    .withSuccessHandler(function(r){
      btn.disabled=false;
      btn.textContent='Đăng ký ca';

      if(msg){
        msg.textContent=r?.message||'';
        msg.style.color=r?.ok?'#0f9f75':'#c2414a';
      }

      if(r?.ok){
        document.getElementById('shiftStart').value='';
        document.getElementById('shiftEnd').value='';
        loadEmployeeSchedule_();
      }
    })
    .withFailureHandler(function(err){
      btn.disabled=false;
      btn.textContent='Đăng ký ca';

      if(msg){
        msg.textContent=
          'Không thể đăng ký: '+
          String(err?.message||'Lỗi kết nối.');
        msg.style.color='#c2414a';
      }
    })
    .registerShift(currentSessionToken,data);
}

function getEmployeeWeekStart_(date){
  const d=new Date(date);
  d.setHours(0,0,0,0);

  const day=d.getDay();
  d.setDate(
    d.getDate()-
    (day===0?6:day-1)
  );

  return d;
}

function getEmployeeNextWeekBoundsV34_(){
  const start=new Date(getEmployeeWeekStart_(new Date()));
  start.setDate(start.getDate()+7);
  start.setHours(0,0,0,0);

  const end=new Date(start);
  end.setDate(end.getDate()+6);

  const key=function(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  };

  const fmt=new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});

  return {
    start:start,
    end:end,
    startKey:key(start),
    endKey:key(end),
    label:fmt.format(start)+' – '+fmt.format(end)
  };
}

function formatScheduleDisplayTimeV34_(value){
  const text=String(value==null?'':value).trim();
  const match=text.match(/(?:^|\s)(\d{1,2}):(\d{2})(?::\d{2})?/);
  if(!match)return text;
  return String(Number(match[1]))+':'+match[2];
}

function filterApprovedOfficialItemsV34_(items){
  return (items||[]).filter(function(item){
    return String(item.status||'').toUpperCase()==='APPROVED';
  });
}

function filterNextWeekRegistrationItemsV34_(items){
  const bounds=getEmployeeNextWeekBoundsV34_();
  return (items||[]).filter(function(item){
    const key=employeeDateKey_(item.date);
    const status=String(item.status||'').toUpperCase();
    return key>=bounds.startKey && key<=bounds.endKey && status!=='CANCELLED';
  });
}

function employeeDateKey_(value){
  if(!value)return '';

  if(
    typeof value==='string' &&
    /^\d{4}-\d{2}-\d{2}$/.test(value)
  ){
    return value;
  }

  const d=new Date(value);

  if(isNaN(d.getTime())){
    return String(value).slice(0,10);
  }

  return d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
}

function getShiftPeriodClassV33_(shift){
  const start=String(shift?.start||'').trim();
  const hour=parseInt(start.split(':')[0],10);

  if(!isNaN(hour)){
    if(hour>=5&&hour<12)return'shift-morning';
    if(hour>=12&&hour<17)return'shift-afternoon';
    if(hour>=17||hour<5)return'shift-evening';
  }

  return'shift-other';
}

function getShiftStatusClassV33_(status){
  const value=String(status||'').toUpperCase();
  if(value==='PENDING')return' pending';
  if(value==='CANCELLED')return' cancelled';
  return' approved';
}

function getShiftStatusLabelV33_(status){
  const value=String(status||'').toUpperCase();
  if(value==='APPROVED')return'Đã duyệt';
  if(value==='PENDING')return'Chờ duyệt';
  if(value==='CANCELLED')return'Đã hủy';
  return value||'Không xác định';
}

function renderOfficialScheduleGridV34_(targetId,items){
  const grid=document.getElementById(targetId);
  if(!grid)return;

  const start=getEmployeeWeekStart_(new Date());
  const end=new Date(start); end.setDate(end.getDate()+6);
  const label=document.getElementById('scheduleWeekLabel');
  const fmt=new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});
  if(label)label.textContent=fmt.format(start)+' – '+fmt.format(end);

  const weekdays=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'];
  const todayKey=employeeDateKey_(new Date());
  const byDate={};
  filterApprovedOfficialItemsV34_(items).forEach(function(item){
    const key=employeeDateKey_(item.date);
    if(!byDate[key])byDate[key]=[];
    byDate[key].push(item);
  });

  grid.innerHTML=Array.from({length:7},function(_,i){
    const date=new Date(start); date.setDate(start.getDate()+i);
    const dateKey=employeeDateKey_(date);
    const shifts=(byDate[dateKey]||[]).slice().sort(function(a,b){
      return String(a.start||'').localeCompare(String(b.start||''));
    });

    const body=shifts.length
      ? '<div class="employee-day-shifts">'+shifts.map(function(shift){
          const periodClass=getShiftPeriodClassV33_(shift);
          const time=formatScheduleDisplayTimeV34_(shift.start)+'-'+formatScheduleDisplayTimeV34_(shift.end);
          return '<div class="employee-shift-chip '+periodClass+' schedule-official-shift-v34">'+
                   '<strong>'+escapeClientHtml(time)+'</strong>'+
                 '</div>';
        }).join('')+'</div>'
      : '<div class="employee-day-empty">Chưa có ca</div>';

    return '<div class="employee-day-card '+(dateKey===todayKey?'today':'')+' schedule-official-day-v34">'+
             '<div class="employee-day-head"><strong>'+weekdays[i]+'</strong><span>'+fmt.format(date)+'</span></div>'+
             body+
           '</div>';
  }).join('');
}

function renderNextWeekRegistrationGridV34_(targetId,items){
  const grid=document.getElementById(targetId);
  if(!grid)return;

  const bounds=getEmployeeNextWeekBoundsV34_();
  const start=bounds.start;
  const fmt=new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});
  const weekdays=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'];
  const byDate={};
  filterNextWeekRegistrationItemsV34_(items).forEach(function(item){
    const key=employeeDateKey_(item.date);
    if(!byDate[key])byDate[key]=[];
    byDate[key].push(item);
  });

  grid.innerHTML=Array.from({length:7},function(_,i){
    const date=new Date(start); date.setDate(start.getDate()+i);
    const dateKey=employeeDateKey_(date);
    const shifts=(byDate[dateKey]||[]).slice().sort(function(a,b){
      return String(a.start||'').localeCompare(String(b.start||''));
    });

    const body=shifts.length
      ? '<div class="employee-day-shifts">'+shifts.map(function(shift){
          const periodClass=getShiftPeriodClassV33_(shift);
          const status=String(shift.status||'').toUpperCase();
          const statusLabel=getShiftStatusLabelV33_(status);
          const originLabel=shift.origin==='MANAGER_ASSIGNED'?'Quản lý xếp lịch':'';
          const time=formatScheduleDisplayTimeV34_(shift.start)+'-'+formatScheduleDisplayTimeV34_(shift.end);
          return '<div class="employee-shift-chip '+periodClass+getShiftStatusClassV33_(status)+' schedule-registration-shift-v34">'+
                   '<strong>'+escapeClientHtml(time)+'</strong>'+
                   '<span class="employee-shift-status">'+escapeClientHtml(statusLabel)+'</span>'+
                   (originLabel?'<span class="employee-shift-origin">'+escapeClientHtml(originLabel)+'</span>':'')+
                 '</div>';
        }).join('')+'</div>'
      : '<div class="employee-day-empty">Chưa có đăng ký</div>';

    return '<div class="employee-day-card schedule-registration-day-v34">'+
             '<div class="employee-day-head"><strong>'+weekdays[i]+'</strong><span>'+fmt.format(date)+'</span></div>'+
             body+
           '</div>';
  }).join('');
}

function loadEmployeeSchedule_(){
  google.script.run
    .withSuccessHandler(function(r){
      const weeklyBox=document.getElementById('employeeWeekSchedule');
      const historyBox=document.getElementById('employeeScheduleHistory');
      if(!weeklyBox||!historyBox)return;

      if(!r||!r.ok){
        weeklyBox.innerHTML='<div class="employee-empty">Không thể tải lịch làm việc.</div>';
        historyBox.innerHTML='<div class="employee-empty">Không thể tải đăng ký tuần tới.</div>';
        return;
      }

      const items=Array.isArray(r.items)?r.items:[];
      renderOfficialScheduleGridV34_('employeeWeekSchedule',items);
      renderNextWeekRegistrationGridV34_('employeeScheduleHistory',items);
    })
    .withFailureHandler(function(err){
      const weeklyBox=document.getElementById('employeeWeekSchedule');
      const historyBox=document.getElementById('employeeScheduleHistory');
      const message='Có lỗi kết nối: '+String(err?.message||'Không xác định.');
      if(weeklyBox)weeklyBox.innerHTML='<div class="employee-empty">'+escapeClientHtml(message)+'</div>';
      if(historyBox)historyBox.innerHTML='<div class="employee-empty">'+escapeClientHtml(message)+'</div>';
    })
    .getMySchedule(currentSessionToken);
}
