name: Workforce V2 CI
on:
  pull_request:
    branches: [main]
    paths: ['index.html','scheduler/**','supabase/**','web/**','PROJECT_CONTROL/**','.github/workflows/workforce-v2.yml']
  push:
    branches: [main, workforce-v2-integration]
    paths: ['index.html','scheduler/**','supabase/**','web/**','PROJECT_CONTROL/**','.github/workflows/workforce-v2.yml']
jobs:
  scheduler:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: scheduler}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
  web-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Syntax and security contract checks
        shell: bash
        run: |
          set -euo pipefail
          for f in web/app.js web/workforce-ui.js web/attendance-workforce-ui.js web/manager-workforce-ui.js web/shift-swap-workforce-ui.js web/schedule-ui-v2.js web/supabase-config.js web/security-runtime.js web/auth-runtime-v4.js; do node --check "$f"; done
          node <<'NODE'
          const fs=require('fs');
          const checks=[
            ['web/secure-app-runtime.html',['MAGASIN application','security-runtime.js']],
            ['web/index.html',['auth-runtime-v4.js','view-login','view-register','view-forgot','view-reset']],
            ['web/auth-runtime-v4.js',['sb.auth.signInWithPassword','sb.auth.signUp','sb.auth.resetPasswordForEmail','PASSWORD_RECOVERY','sb.auth.updateUser({password','resolve_login_email','authRoot','authRedirect']],
            ['web/security-runtime.js',['MAGASIN_SECURITY','updateUser({password','Bảo mật tài khoản']],
            ['web/manager-workforce-ui.js',['validate_schedule_generation_v1','review_schedule_generation','publish_schedule_generation','Kiểm tra','Duyệt lịch','Phát hành']],
            ['supabase/migrations/20260828001600_attendance_schedule_link_v1.sql',['get_my_today_schedules','clock_in_for_schedule','clock_out_attendance','get_my_attendance_v2','APPROVED_SCHEDULE_NOT_FOUND']]
          ];
          for(const [file,needles] of checks){const s=fs.readFileSync(file,'utf8');for(const n of needles){if(!s.includes(n))throw new Error(`${file}: missing ${n}`)}}
          NODE
          grep -q "list_my_approved_schedules_v2.*weekArg" web/schedule.html
          ! grep -q "const arg={p_store_id" web/schedule.html
          grep -q "function employeeLabel" web/schedule.html
      - name: Syntax check Employee V40 runtime bridge
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'); const html=fs.readFileSync('web/employee-v40-runtime.html','utf8'); const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)]; if(!scripts.length) process.exit(1); fs.writeFileSync('/tmp/employee-v40-runtime.js',scripts[scripts.length-1][1]);"
          node --check /tmp/employee-v40-runtime.js
          grep -q "get_my_today_schedules" web/employee-v40-runtime.html
          grep -q "clock_in_for_schedule" web/employee-v40-runtime.html
          grep -q "clock_out_attendance" web/employee-v40-runtime.html
          grep -q "get_my_attendance_v2" web/employee-v40-runtime.html
  supabase-regression-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate regression fixture syntax
        run: |
          test -s supabase/tests/workforce_v2_review_publish_regression.sql
          grep -q "validate_schedule_generation_v1" supabase/tests/workforce_v2_review_publish_regression.sql
          grep -q "x.work_date + x.end_time" supabase/tests/workforce_v2_review_publish_regression.sql
          test -s supabase/tests/schedule_read_v1_controlled_publish_attendance.sql
          grep -q "publish_schedule_generation" supabase/tests/schedule_read_v1_controlled_publish_attendance.sql
          grep -q "list_my_approved_schedules_v2" supabase/tests/schedule_read_v1_controlled_publish_attendance.sql
          grep -q "get_manager_weekly_schedule" supabase/tests/schedule_read_v1_controlled_publish_attendance.sql
          grep -q "clock_in_for_schedule(schedule_id)" supabase/tests/schedule_read_v1_controlled_publish_attendance.sql
          grep -q "clock_out_attendance(attendance_id)" supabase/tests/schedule_read_v1_controlled_publish_attendance.sql
  Workforce-V2-CI:
    name: Workforce V2 CI
    runs-on: ubuntu-latest
    needs: [scheduler, web-syntax, supabase-regression-guards]
    if: ${{ always() }}
    steps:
      - name: Require all Workforce V2 jobs to pass
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.scheduler.result }}" = "success"
          test "${{ needs.web-syntax.result }}" = "success"
          test "${{ needs.supabase-regression-guards.result }}" = "success"
