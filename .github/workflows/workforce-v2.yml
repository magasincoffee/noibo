name: Workforce V2 CI

# Final integration checkpoint: keep scheduler, frontend syntax, and regression guards on every Workforce change.

on:
  pull_request:
    branches: [main]
    paths:
      - 'scheduler/**'
      - 'supabase/**'
      - 'web/**'
      - '.github/workflows/workforce-v2.yml'
  push:
    branches: [main, workforce-v2-integration, phase10-shift-swap]
    paths:
      - 'scheduler/**'
      - 'supabase/**'
      - 'web/**'
      - '.github/workflows/workforce-v2.yml'

jobs:
  phase10-frontend-hotfix:
    if: github.ref == 'refs/heads/phase10-shift-swap' && github.event.head_commit.message != 'fix: preserve password recovery and show approved swap schedules'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch password recovery and swap schedule list
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('web/app.js')
          s = p.read_text()
          old = "async function boot(){bind();const params=new URLSearchParams(location.search);if(params.get('auth')==='reset')view('reset');const {data}=await sb.auth.getSession();if(data.session){try{const p=await loadProfile(data.session.user);if(params.get('auth')==='verify'){profile=p;await sb.auth.signOut();history.replaceState({},document.title,location.origin+location.pathname);return openApp(p);}return openApp(p);}catch(err){await sb.auth.signOut();}}}"
          new = "async function boot(){bind();const params=new URLSearchParams(location.search);const isReset=params.get('auth')==='reset';if(isReset)view('reset');const {data}=await sb.auth.getSession();if(isReset)return;if(data.session){try{const p=await loadProfile(data.session.user);if(params.get('auth')==='verify'){profile=p;await sb.auth.signOut();history.replaceState({},document.title,location.origin+location.pathname);return openApp(p);}return openApp(p);}catch(err){await sb.auth.signOut();}}}"
          if old not in s:
              raise SystemExit('app.js boot pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('web/shift-swap-workforce-ui.js')
          s = p.read_text()
          old = "    return (Array.isArray(data)?data:[]).filter(x=>String(x.status).toUpperCase()==='APPROVED');"
          new = "    return Array.isArray(data)?data:[];"
          if old not in s:
              raise SystemExit('shift-swap schedule filter pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify hotfix syntax
        run: |
          node --check web/app.js
          node --check web/shift-swap-workforce-ui.js

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js web/shift-swap-workforce-ui.js
          git commit -m "fix: preserve password recovery and show approved swap schedules"
          git push origin HEAD:phase10-shift-swap

  scheduler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test

  web-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check Workforce frontend JS
        shell: bash
        run: |
          set -euo pipefail
          for f in web/app.js web/workforce-ui.js web/attendance-workforce-ui.js web/manager-workforce-ui.js web/supabase-config.js; do
            node --check "$f"
          done

  supabase-regression-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate regression fixture syntax
        run: |
          test -s supabase/tests/workforce_v2_review_publish_regression.sql
          grep -q "validate_schedule_generation_v1" supabase/tests/workforce_v2_review_publish_regression.sql
          grep -q "x.work_date + x.end_time" supabase/tests/workforce_v2_review_publish_regression.sql
