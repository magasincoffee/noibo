name: Workforce V2 route cleanup

on:
  push:
    branches: [workforce-v2-integration]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[route-cleanup-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicated staffing route guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/app.js')
          s=p.read_text(encoding='utf-8')
          dup="if(page==='staffing' && window.MAGASIN_WORKFORCE_MANAGER_UI) return window.MAGASIN_WORKFORCE_MANAGER_UI.render('demand');if(page==='staffing' && window.MAGASIN_WORKFORCE_MANAGER_UI) return window.MAGASIN_WORKFORCE_MANAGER_UI.render('demand');"
          one="if(page==='staffing' && window.MAGASIN_WORKFORCE_MANAGER_UI) return window.MAGASIN_WORKFORCE_MANAGER_UI.render('demand');"
          if dup not in s:
              raise SystemExit('duplicated route guard not found')
          p.write_text(s.replace(dup,one,1),encoding='utf-8')
          PY
      - name: Commit cleanup and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/workforce-v2-route-cleanup.yml
          git add web/app.js .github/workflows/workforce-v2-route-cleanup.yml
          git commit -m 'fix: clean duplicated Workforce V2 route guard [route-cleanup-applied]'
          git push
