name: Workforce V2 route fix

on:
  push:
    branches: [workforce-v2-integration]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[route-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch staffing route to Workforce V2
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/app.js')
          s = p.read_text(encoding='utf-8')
          old = "if(page==='staffing')return staffing(box);"
          new = "if(page==='staffing' && window.MAGASIN_WORKFORCE_MANAGER_UI) return window.MAGASIN_WORKFORCE_MANAGER_UI.render('demand');if(page==='staffing')return staffing(box);"
          if old not in s:
              raise SystemExit('target route not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit route fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/workforce-v2-route-fix.yml
          git add web/app.js .github/workflows/workforce-v2-route-fix.yml
          git commit -m 'fix: route OWNER staffing to Workforce V2 [route-fix-applied]'
          git push
