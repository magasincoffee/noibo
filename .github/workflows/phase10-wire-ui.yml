name: Phase 10 wire UI
on:
  workflow_dispatch:
  push:
    branches: [phase10-shift-swap]
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Shift Swap UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('web/app.js')
          text = app.read_text()
          old = "async function openApp(p){profile=p;hideAuth();setUserUi();renderMenu();"
          new = "async function openApp(p){profile=p;window.MAGASIN_PROFILE=profile;hideAuth();setUserUi();renderMenu();"
          if old not in text:
              raise SystemExit('openApp anchor not found')
          text = text.replace(old, new, 1)
          old2 = "if(page==='attendance')return attendance(box);"
          new2 = "if(page==='attendance')return attendance(box);if(page==='swap' && window.MAGASIN_SHIFT_SWAP_UI)return window.MAGASIN_SHIFT_SWAP_UI.render('employee');"
          if old2 not in text:
              raise SystemExit('swap route anchor not found')
          text = text.replace(old2, new2, 1)
          app.write_text(text)

          cfg = Path('web/supabase-config.js')
          text = cfg.read_text()
          old = "['workforce-ui.js','attendance-workforce-ui.js','manager-workforce-ui.js']"
          new = "['workforce-ui.js','attendance-workforce-ui.js','manager-workforce-ui.js','shift-swap-workforce-ui.js']"
          if old not in text:
              raise SystemExit('loader anchor not found')
          text = text.replace(old, new, 1)
          oldv = "?v=20260828-workforce-v2"
          newv = "?v=20260829-workforce-v2-phase10"
          text = text.replace(oldv, newv, 1)
          cfg.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app.js web/supabase-config.js
          git diff --cached --check
          git commit -m 'feat(workforce): wire phase 10 shift swap ui'
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/phase10-wire-ui.yml
          git commit -m 'chore: remove temporary phase10 wiring workflow'
          git push
