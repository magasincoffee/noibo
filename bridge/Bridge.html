<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAGASIN API Bridge</title>
</head>
<body>
<script>
(function(){
  'use strict';

  const TRUSTED_PARENT_ORIGIN='https://magasincoffee.github.io';
  const READY_TYPE='MAGASIN_BRIDGE_READY';
  const REQUEST_TYPE='MAGASIN_BRIDGE_REQUEST';
  const RESPONSE_TYPE='MAGASIN_BRIDGE_RESPONSE';

  function getBridgeId_(){
    try{
      return String(new URLSearchParams(window.location.search).get('bridgeId') || '').trim();
    }catch(err){
      return '';
    }
  }

  function sendReady_(){
    const bridgeId=getBridgeId_();
    const channel=new MessageChannel();
    const port=channel.port1;

    port.onmessage=function(event){
      const data=event.data||{};
      if(data.type!==REQUEST_TYPE)return;

      const requestId=String(data.requestId||'');
      const action=String(data.action||'').trim();
      const payload=data.payload&&typeof data.payload==='object'?data.payload:{};
      const sessionToken=String(data.sessionToken||'').trim();

      if(!requestId||!action)return;

      google.script.run
        .withSuccessHandler(function(result){
          port.postMessage({
            type:RESPONSE_TYPE,
            requestId:requestId,
            ok:!!(result&&result.ok!==false),
            result:result||{ok:false,message:'Bridge không trả về dữ liệu.'}
          });
        })
        .withFailureHandler(function(error){
          port.postMessage({
            type:RESPONSE_TYPE,
            requestId:requestId,
            ok:false,
            result:{
              ok:false,
              message:String(error&&error.message||error||'Bridge execution failed.')
            }
          });
        })
        .magasinBridgeCall(action,payload,sessionToken);
    };

    if(port.start)port.start();

    try{
      window.top.postMessage({
        type:READY_TYPE,
        version:'20260827-06',
        bridgeId:bridgeId
      },TRUSTED_PARENT_ORIGIN,[channel.port2]);
    }catch(err){
      // Do not fall back to window.parent: Apps Script wraps user HTML
      // in a Google-controlled iframe whose origin is not the GitHub page.
    }
  }

  sendReady_();
  window.setTimeout(sendReady_,500);
</script>
</body>
</html>
