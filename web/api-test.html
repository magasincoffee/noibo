<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAGASIN API Test</title>
  <style>
    body{font-family:'Be Vietnam Pro',Arial,sans-serif;background:#f5f7fb;color:#172033;padding:24px}
    main{max-width:760px;margin:0 auto;background:#fff;border:1px solid #e4eaf1;border-radius:16px;padding:24px;box-shadow:0 12px 30px rgba(15,23,42,.06)}
    h1{margin:0 0 8px}.muted{color:#64748b;line-height:1.6}.row{display:grid;gap:8px;margin-top:18px}label{font-size:13px;font-weight:700}input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d7e0ea;border-radius:10px;font:inherit}button{margin-top:12px;padding:11px 16px;border:0;border-radius:10px;background:#16aebd;color:#fff;font-weight:700;cursor:pointer}.status{margin-top:18px;padding:14px;border-radius:10px;background:#f8fafc;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  </style>
</head>
<body>
<main>
  <h1>MAGASIN — API Bridge Test</h1>
  <p class="muted">Trang này chỉ kiểm tra kết nối GitHub Pages → Google Apps Script. Không chứa mật khẩu hoặc secret.</p>
  <div class="row">
    <label for="apiUrl">Apps Script Web App URL</label>
    <input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <button id="testBtn" type="button">Kiểm tra API</button>
  </div>
  <div id="status" class="status">Chưa kiểm tra.</div>
</main>
<script src="./api-config.js"></script>
<script src="./api.js"></script>
<script>
  const urlEl=document.getElementById('apiUrl');
  const statusEl=document.getElementById('status');
  const button=document.getElementById('testBtn');

  urlEl.value=String(window.MAGASIN_API_URL||'');

  button.addEventListener('click',async function(){
    const url=String(urlEl.value||'').trim();
    if(!url){
      statusEl.textContent='Vui lòng nhập Web App URL.';
      return;
    }

    window.MAGASIN_API_URL=url;
    button.disabled=true;
    button.textContent='Đang kiểm tra…';
    statusEl.textContent='Đang gửi health request…';

    try{
      const result=await MAGASIN_API.health();
      statusEl.textContent=JSON.stringify(result,null,2);
    }catch(err){
      statusEl.textContent='LỖI:\n'+String(err&&err.message||err);
    }finally{
      button.disabled=false;
      button.textContent='Kiểm tra API';
    }
  });
</script>
</body>
</html>
