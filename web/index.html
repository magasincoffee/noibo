<style>

p{margin:4px 0 0;color:var(--muted);font-size:13px}.hamburger{width:44px;height:44px;border:0;border-radius:11px;background:#f1f5f9;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:10px}.hamburger span{display:block;width:22px;height:2.5px;margin:auto;border-radius:999px;background:#172033;transition:.18s}.hamburger.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}.hamburger.open span:nth-child(2){opacity:0}.hamburger.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}.user-dot{width:36px;height:36px;border-radius:50%;background:var(--teal)}.drawer{position:fixed;left:0;top:72px;bottom:0;z-index:1100;width:min(320px,calc(100vw - 28px));background:var(--navy);color:#fff;transform:translateX(-102%);transition:transform .24s;display:flex;flex-direction:column;box-shadow:18px 0 42px rgba(7,17,31,.25)}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #ffffff14}.drawer-logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#19d6d0,#0ba8c6);display:grid;place-items:center;font-weight:800}.drawer-brand strong,.drawer-brand span{display:block}.drawer-brand span{margin-top:3px;color:#8fa2bd;font-size:12px}.drawer-menu{padding:14px 12px;overflow:auto;flex:1}.drawer-btn,.drawer-parent{width:100%;min-height:50px;border:0;border-radius:12px;background:transparent;color:#dbe5f1;display:flex;align-items:center;gap:12px;padding:11px 14px;text-align:left;margin-bottom:4px}.drawer-btn:hover,.drawer-parent:hover{background:#ffffff12;color:#fff}.drawer-btn.active{background:#0fbab825;color:#69e7e3}.drawer-parent{justify-content:space-between}.arrow{font-size:22px;transition:.18s}.drawer-group.open .arrow{transform:rotate(90deg)}.drawer-children{display:none;padding-left:12px}.drawer-group.open .drawer-children{display:block}.drawer-bottom{padding:12px;border-top:1px solid #ffffff14}.drawer-user{display:flex;align-items:center;gap:10px;padding:8px}.avatar{width:40px;height:40px;border-radius:50%;background:var(--teal);display:grid;place-items:center;font-weight:700}.drawer-user small{display:block;color:#91a2b9;margin-top:2px}.logout{width:100%;min-height:42px;border:0;border-radius:9px;background:#ffffff10;color:#c8d4e5}.overlay{position:fixed;inset:72px 0 0;z-index:1050;background:#0f172a7a;opacity:0;visibility:hidden;pointer-events:none;transition:.2s}.overlay.active{opacity:1;visibility:visible;pointer-events:auto}.content{padding:32px 36px;max-width:1600px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.panel{padding:20px;margin-bottom:16px}.toolbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}.toolbar h2,.toolbar h3{margin:0;color:#243248}.toolbar p{margin:6px 0 0;color:var(--muted);font-size:13px}.legend{display:flex;gap:12px 18px;flex-wrap:wrap;margin:14px 0;color:#607086;font-size:11px;font-weight:700}.legend span{display:inline-flex;align-items:center;gap:6px}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:10px;overflow:auto}.day{min-height:250px;padding:12px;border:1px solid #dfe7ef;border-radius:16px;background:#fbfcfe}.day-head{display:flex;flex-direction:column;gap:3px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid #e9eef3}.day-head strong{font-size:14px}.day-head span{font-size:12px;color:#7b899b}.shifts{display:flex;flex-direction:column;gap:8px}.shift{min-height:58px;border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:#1f3047}.shift.m{background:var(--blue);border:1px solid #91c9f5}.shift.a{background:var(--red);border:1px solid #f2a4a0}.shift.e{background:var(--pastel);border:1px solid #9dd8de}.empty{min-height:120px;border:1px dashed #d8e0e8;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13px;background:#fafbfd}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.field label{display:block;color:#475569;font-size:12px;font-weight:700}.field input,.field select{width:100%;margin-top:6px;min-height:48px;padding:10px 12px;border:1px solid #d7e0ea;border-radius:10px;background:#fff;color:#1e293b}.primary{width:auto;min-width:150px;padding:0 18px;margin-top:14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:11px 13px;border-bottom:1px solid #edf1f5;text-align:left;font-size:12px}.table th{background:#f7fafc;color:#475569}@media(max-width:1100px){.content{padding:28px}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:768px){.topbar{height:64px;padding:0 14px}.topbar h2{font-size:18px}.topbar p{font-size:11px}.drawer{top:64px;height:calc(100dvh - 64px);width:min(84vw,340px)}.overlay{inset:64px 0 0}.content{padding:18px 14px 24px}.form-grid{grid-template-columns:1fr}.week-grid{grid-template-columns:repeat(7,minmax(145px,1fr))}}@media(max-width:420px){.drawer{width:min(88vw,320px)}.content{padding:14px 12px 22px}}
</style>

<body class="booting">
<section id="auth" class="auth"><main class="auth-card"><div class="brand"><div class="logo">A</div><h1>MAGASIN</h1><p>Quản lý chuỗi cửa hàng đồ uống</p></div><form id="loginForm"><label>Tên đăng nhập<input id="username" autocomplete="username" required></label><label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label><button id="loginBtn" class="button" type="submit">Đăng nhập</button></form><p id="authMessage" class="message"></p><p class="footer">© 2026 MAGASIN · GitHub Frontend</p></main></section>
<section id="app" class="app"><div id="overlay" class="overlay"></div><aside id="drawer" class="drawer"><div class="drawer-head"><div class="drawer-logo">A</div><div class="drawer-brand"><strong>MAGASIN</strong><span>Hệ thống nội bộ</span></div></div><nav id="drawerMenu" class="drawer-menu"></nav><div class="drawer-bottom"><div class="drawer-user"><div id="avatar" class="avatar">U</div><div><strong id="userName">Người dùng</strong><small id="userRole">Nhân viên</small></div></div><button id="logoutBtn" class="logout">Đăng xuất</button></div></aside><main class="main"><header class="topbar"><div class="topbar-leading"><button id="hamburger" class="hamburger" aria-label="Mở menu" aria-expanded="false"><span></span><span></span><span></span></button><div><h2 id="pageTitle">Tổng quan</h2><p id="pageDescription">Tổng quan hoạt động hệ thống</p></div></div><div class="user-dot"></div></header><div id="content" class="content"></div></main></section>
<script src="api-config.js"></script><script src="api.js"></script>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id),state={user:null,page:'dashboard',drawer:false};
const META={dashboard:['Tổng quan','Tổng quan hoạt động hệ thống'],schedule:['Lịch làm','Quản lý công việc cá nhân'],attendance:['Chấm công','Quản lý giờ công cá nhân'],swap:['Đổi ca','Quản lý yêu cầu đổi ca'],inventory:['Kho hàng','Quản lý hàng hóa và tồn kho'],account:['Tài khoản','Thông tin cá nhân và bảo mật tài khoản'],orders:['Đơn hàng','Theo dõi đơn hàng'],reports:['Báo cáo','Theo dõi dữ liệu'],settings:['Cài đặt','Thiết lập hệ thống']};
const ROLE_LABELS={OWNER:'Chủ cửa hàng',INVENTORY_MANAGER:'Quản lý kho',STORE_MANAGER:'Quản lý cửa hàng',STAFF:'Nhân viên'};
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dataOf=r=>r&&r.data!==undefined?r.data:r;
function role(){const v=String(state.user&&state.user.role||'').toUpperCase();return v==='OWNER'||v==='CHỦ CỬA HÀNG'?'OWNER':v==='INVENTORY_MANAGER'||v==='QUẢN LÝ KHO'?'INVENTORY_MANAGER':v==='STORE_MANAGER'||v==='MANAGER'||v==='QUẢN LÝ CỬA HÀNG'?'STORE_MANAGER':'STAFF'}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);const n=x.getDay();x.setDate(x.getDate()-(n===0?6:n-1));return x}
function timeClass(s){const h=Number(String(s||'').slice(0,2));return h<12?'m':h<17?'a':'e'}
function openDrawer(){state.drawer=true;$('drawer').classList.add('open');$('overlay').classList.add('active');$('hamburger').classList.add('open');$('hamburger').setAttribute('aria-expanded','true')}
function closeDrawer(){state.drawer=false;$('drawer').classList.remove('open');$('overlay').classList.remove('active');$('hamburger').classList.remove('open');$('hamburger').setAttribute('aria-expanded','false')}
function menu(){const r=role();let items=[['dashboard','🏠','Tổng quan']];if(r==='STAFF')items=items.concat([['schedule','📅','Lịch làm'],['attendance','⏱️','Chấm công'],['swap','🔄','Đổi ca'],['inventory','📦','Tồn hàng'],['account','👤','Thông tin cá nhân']]);else if(r==='OWNER'||r==='STORE_MANAGER')items=items.concat([['inventory','📦','Kho hàng'],['attendance','⏱️','Chấm công'],['orders','🛒','Đơn hàng'],['reports','📊','Báo cáo'],['settings','⚙️','Cài đặt'],['account','👤','Thông tin cá nhân']]);else items=items.concat([['inventory','📦','Kho hàng'],['reports','📊','Báo cáo'],['account','👤','Thông tin cá nhân']]);return items}
function renderMenu(){const r=role();let h='';if(r==='STAFF'){h+='<button class="drawer-btn '+(state.page==='dashboard'?'active':'')+'" data-page="dashboard"><span>🏠</span>Tổng quan</button><div class="drawer-group open"><button class="drawer-parent" type="button" data-group="work"><span>Công việc</span><span class="arrow">›</span></button><div class="drawer-children">'+[['schedule','📅','Lịch làm'],['attendance','⏱️','Chấm công'],['swap','🔄','Đổi ca']].map(i=>'<button type="button" class="drawer-btn '+(state.page===i[0]?'active':'')+'" data-page="'+i[0]+'"><span>'+i[1]+'</span>'+i[2]+'</button>').join('')+'</div></div><button class="drawer-btn '+(state.page==='inventory'?'active':'')+'" data-page="inventory"><span>📦</span>Tồn hàng</button><button class="drawer-btn '+(state.page==='account'?'active':'')+'" data-page="account"><span>👤</span>Thông tin cá nhân</button>'}else{h=menu().map(i=>'<button type="button" class="drawer-btn '+(state.page===i[0]?'active':'')+'" data-page="'+i[0]+'"><span>'+i[1]+'</span>'+i[2]+'</button>').join('')}$('drawerMenu').innerHTML=h;$('drawerMenu').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('drawerMenu').querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'))}
function renderShell(){const n=state.user&& (state.user.name||state.user.fullName)||'Người dùng';$('userName').textContent=n;$('userRole').textContent=ROLE_LABELS[role()]||'Nhân viên';$('avatar').textContent=n.charAt(0).toUpperCase();renderMenu()}
function navigate(p){state.page=p;renderMenu();closeDrawer();renderPage()}
function renderPage(){const m=META[state.page]||META.dashboard;$('pageTitle').textContent=m[0];$('pageDescription').textContent=m[1];if(state.page==='schedule')return schedule();if(state.page==='attendance')return attendance();const copy={dashboard:['Chào mừng đến với MAGASIN','Chọn chức năng từ menu để bắt đầu vận hành hệ thống.'],inventory:['Kho hàng','Khu vực kho sẽ sử dụng API backend của MAGASIN.'],account:['Tài khoản',(state.user&&state.user.email)||''],orders:['Đơn hàng','Khu vực đơn hàng sẽ được tích hợp tiếp theo.'],reports:['Báo cáo','Khu vực báo cáo sẽ được tích hợp tiếp theo.'],settings:['Cài đặt','Khu vực cài đặt hệ thống.'],swap:['Đổi ca','Khu vực yêu cầu đổi ca sẽ dùng API backend.']}[state.page]||['MAGASIN',''];$('content').innerHTML='<section class="card panel"><div class="toolbar"><div><h2>'+esc(copy[0])+'</h2><p>'+esc(copy[1])+'</p></div></div></section>'}
async function schedule(){
$('content').innerHTML='<section class="card panel"><div class="toolbar"><div><h2>Lịch làm việc trong tuần</h2><p>Ca chính thức trong tuần hiện tại.</p></div></div><div class="legend"><span>🟦 5:00–12:00</span><span>🟥 12:00–17:00</span><span>🟩 17:00–22:00</span></div><div id="official" class="week-grid"><div class="empty">Đang tải...</div></div></section><section class="card panel"><div class="toolbar"><div><h2>Đăng ký ca làm tuần tới</h2><p>7 ngày kế tiếp · chốt lịch chính thức cuối Chủ nhật.</p></div></div><div class="form-grid"><div class="field"><label>Ngày<input id="shiftDate" type="date"></label></div><div class="field"><label>Giờ bắt đầu<select id="shiftStart"></select></label></div><div class="field"><label>Giờ kết thúc<select id="shiftEnd"></select></label></div><div class="field"><label>Cửa hàng<select id="shiftStore"><option value="">Đang tải...</option></select></label></div></div><button id="registerShift" class="primary">Đăng ký ca</button><p id="shiftMsg" class="status"></p></section><section class="card panel"><div class="toolbar"><div><h2>Đăng ký tuần tới</h2><p>Chờ duyệt / Đã duyệt / Quản lý xếp lịch.</p></div></div><div id="history" class="week-grid"><div class="empty">Đang tải...</div></div></section>';
function opts(id){let h='<option value="">Chọn giờ</option>';for(let hr=0;hr<24;hr++)for(const mn of [0,30]){const v=String(hr).padStart(2,'0')+':'+String(mn).padStart(2,'0');h+='<option value="'+v+'">'+v+'</option>'}$ (id);}
function fillTime(id){let h='<option value="">Chọn giờ</option>';for(let hr=0;hr<24;hr++)for(const mn of [0,30]){const v=String(hr).padStart(2,'0')+':'+String(mn).padStart(2,'0');h+='<option value="'+v+'">'+v+'</option>'}$$(id).innerHTML=h}
const $$=id=>document.getElementById(id);fillTime('shiftStart');fillTime('shiftEnd');const nd=new Date();nd.setDate(nd.getDate()+7);$('shiftDate').value=nd.toISOString().slice(0,10);$('shiftDate').min=nd.toISOString().slice(0,10);const mx=new Date(nd);mx.setDate(mx.getDate()+6);$('shiftDate').max=mx.toISOString().slice(0,10);
function week(arr,history){const start=weekStart(history?nd:new Date());const by={};(Array.isArray(arr)?arr:[]).forEach(s=>{const x=s||{},d=String(x.date||x.workDate||x.shiftDate||'').slice(0,10);if(!by[d])by[d]=[];by[d].push(x)});const labels=['THỨ HAI','THỨ BA','THỨ TƯ','THỨ NĂM','THỨ SÁU','THỨ BẢY','CHỦ NHẬT'];let h='';for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const a=by[d.toISOString().slice(0,10)]||[];h+='<article class="day"><div class="day-head"><strong>'+labels[i]+'</strong><span>'+fmt(d)+'</span></div><div class="shifts">'+(a.length?a.map(s=>'<div class="shift '+timeClass(s.start||s.startTime)+'">'+esc(s.start||s.startTime||'')+'-'+esc(s.end||s.endTime||'')+(history&&s.status?' · '+esc(s.status):'')+'</div>').join(''):'<div class="empty">Chưa có ca</div>')+'</div></article>'}return h}
try{const r=await MAGASIN_API.call('getMySchedule',{}),d=dataOf(r)||{};$('official').innerHTML=week(d.official||d.currentWeek||d.schedule||[],false);$('history').innerHTML=week(d.nextWeek||d.registrations||[],true)}catch(e){$('official').innerHTML='<div class="empty">Không tải được lịch.</div>';$('history').innerHTML='<div class="empty">Không tải được đăng ký.</div>'}
try{const r=await MAGASIN_API.call('getAttendanceOptions',{}),d=dataOf(r)||{},s=d.stores||[];$('shiftStore').innerHTML='<option value="">Chọn cửa hàng</option>'+s.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}catch(e){}
$('registerShift').onclick=async()=>{const p={date:$('shiftDate').value,start:$('shiftStart').value,end:$('shiftEnd').value,store:$('shiftStore').value};if(!p.date||!p.start||!p.end||!p.store){$('shiftMsg').textContent='Vui lòng chọn đủ thông tin.';return}if(p.end<=p.start){$('shiftMsg').textContent='Giờ kết thúc phải lớn hơn giờ bắt đầu.';return}try{const r=await MAGASIN_API.call('registerShift',p);$('shiftMsg').textContent=r.message||'';if(r.ok)renderPage()}catch(e){$('shiftMsg').textContent=e.message}}
}
async function attendance(){$('content').innerHTML='<section class="card panel"><div class="toolbar"><div><h2>Chấm công</h2><p>Ghi nhận giờ vào/ra.</p></div></div><div class="form-grid"><div class="field"><label>Ngày<input id="attDate" type="date"></label></div><div class="field"><label>Cửa hàng<select id="attStore"><option value="">Đang tải...</option></select></label></div><div class="field"><label>Giờ vào<input id="attIn" type="time" step="1800"></label></div><div class="field"><label>Giờ ra<input id="attOut" type="time" step="1800"></label></div></div><button id="saveAtt" class="primary">Lưu chấm công</button><p id="attMsg" class="status"></p></section>';$('attDate').value=todayKey();try{const r=await MAGASIN_API.call('getAttendanceOptions',{}),d=dataOf(r)||{},s=d.stores||[];$('attStore').innerHTML='<option value="">Chọn cửa hàng</option>'+s.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}catch(e){}$('saveAtt').onclick=async()=>{try{const r=await MAGASIN_API.call('createAttendanceRecord',{date:$('attDate').value,store:$('attStore').value,checkIn:$('attIn').value,checkOut:$('attOut').value});$('attMsg').textContent=r.message||''}catch(e){$('attMsg').textContent=e.message}}}
async function login(e){e.preventDefault();$('loginBtn').disabled=true;try{const r=await MAGASIN_API.call('login',{username:$('username').value,password:$('password').value}),d=dataOf(r);if(!r.ok||!d||!d.user){$('authMessage').textContent=r.message||'Đăng nhập không thành công.';return}state.user=d.user;state.page='dashboard';$('auth').classList.add('hidden');$('app').classList.add('active');renderShell();renderPage()}catch(e){$('authMessage').textContent=e.message||'Không thể kết nối backend.'}finally{$('loginBtn').disabled=false}}
async function restore(){const token=MAGASIN_API.getSessionToken();if(!token){document.body.classList.remove('booting');return}try{const r=await MAGASIN_API.call('getSession',{}),d=dataOf(r);if(r.ok&&d&&d.user){state.user=d.user;state.page=localStorage.getItem('magasin_web_page')||'dashboard';$('auth').classList.add('hidden');$('app').classList.add('active');renderShell();renderPage();document.body.classList.remove('booting');return}}catch(e){}MAGASIN_API.clearSession();document.body.classList.remove('booting')}
$('loginForm').onsubmit=login;$('hamburger').onclick=()=>state.drawer?closeDrawer():openDrawer();$('overlay').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});$('logoutBtn').onclick=async()=>{try{await MAGASIN_API.call('logout',{})}catch(e){}MAGASIN_API.clearSession();localStorage.removeItem('magasin_web_page');location.reload()};const oldNavigate=navigate;navigate=function(p){localStorage.setItem('magasin_web_page',p);oldNavigate(p)};restore();
})();
</script>
</body></html>
