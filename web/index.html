<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAGASIN · Đăng nhập</title>
<style>
:root{--bg:#071426;--card:#1d304d;--text:#fff;--muted:#d3dbea;--accent:#16c2cf;--accent2:#25d3dc;--field:#f7f9fc;--error:#ffb6aa}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif}body{min-height:100vh;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:32px 18px}.shell{width:min(700px,100%)}.card{width:100%;background:var(--card);border-radius:26px;padding:38px 38px 28px;box-shadow:0 18px 50px rgba(0,0,0,.22)}.brand{text-align:center;margin-bottom:20px}.logo{width:78px;height:78px;border-radius:21px;background:var(--accent);display:grid;place-items:center;margin:0 auto 16px}.logo svg{width:50px;height:50px}.brand h1{margin:0;font-size:34px;letter-spacing:.01em}.brand p{margin:6px 0 0;font-size:17px;color:var(--accent2);font-weight:600}.field{margin-top:18px}.field label{display:block;margin-bottom:8px;font-size:17px;font-weight:700;text-decoration:underline}.input-wrap{position:relative}.input{width:100%;height:62px;border:0;border-radius:11px;padding:0 18px;background:var(--field);color:#172b45;font-size:19px;outline:none}.input:focus{box-shadow:0 0 0 3px rgba(22,194,207,.28)}.eye{position:absolute;right:15px;top:50%;transform:translateY(-50%);border:0;background:none;color:#7185a3;font-size:22px;cursor:pointer}.forgot{display:inline-block;margin-top:8px;color:#61eff4;font-size:17px;font-weight:700;text-decoration:none}.btn{width:100%;height:62px;border:0;border-radius:11px;margin-top:2px;background:var(--accent);color:#fff;font-size:18px;font-weight:800;cursor:pointer}.btn:hover{background:var(--accent2)}.btn:disabled{opacity:.55;cursor:not-allowed}.register{text-align:center;margin-top:17px;color:#e4eaf2;font-size:16px}.register a{color:#61eff4;font-weight:800;text-decoration:none}.status{text-align:center;margin-top:15px;color:#66f1df;font-size:16px;min-height:21px}.status.error{color:var(--error)}.footer{margin-top:22px;text-align:center;font-size:16px;color:#fff}@media(max-width:600px){.card{padding:28px 20px 24px;border-radius:22px}.brand h1{font-size:29px}.brand p{font-size:15px}.logo{width:68px;height:68px}.input,.btn{height:56px}.field label{font-size:15px}.forgot{font-size:15px}}
</style>
</head>
<body>
<div class="shell"><main class="card">
<div class="brand"><div class="logo"><svg viewBox="0 0 100 100" aria-hidden="true"><path fill="#fff" d="M18 82V53L28 22Q30 16 36 16H64Q70 16 72 22L82 53V82H67V50L61 29H39L33 50V82H18Z"/></svg></div><h1>MAGASIN</h1><p>Hệ thống quản lý nội bộ</p></div>
<div id="status" class="status">Bạn đã đăng xuất.</div>
<form id="loginForm" novalidate>
<div class="field"><label for="username">Tên đăng nhập</label><div class="input-wrap"><input id="username" class="input" autocomplete="username" required></div></div>
<div class="field"><label for="password">Mật khẩu</label><div class="input-wrap"><input id="password" class="input" type="password" autocomplete="current-password" required><button id="togglePassword" class="eye" type="button" aria-label="Hiện mật khẩu">◉</button></div><a href="#" id="forgot" class="forgot">Quên mật khẩu?</a></div>
<button id="submit" class="btn" type="submit">Đăng nhập</button></form>
<div class="register">Chưa có tài khoản? <a href="#" id="register">Đăng ký ngay</a></div>
<div class="footer">© 2026 MAGASIN · Hệ thống nội bộ</div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>(function(){'use strict';const sb=supabase.createClient('https://menvbzlsncmpuvnaifxa.supabase.co','sb_publishable_HsvCS6HDZnCDInd9PUoh0g_V34wJVqx',{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}}),form=document.getElementById('loginForm'),btn=document.getElementById('submit'),status=document.getElementById('status'),pw=document.getElementById('password');function setStatus(m,error){status.textContent=m;status.classList.toggle('error',!!error)}async function route(){const {data}=await sb.auth.getSession();if(!data.session)return;const {data:p}=await sb.from('profiles').select('role,status').eq('id',data.session.user.id).single();if(!p||String(p.status||'').toUpperCase()!=='ACTIVE')return;const role=String(p.role||'STAFF').toUpperCase();location.replace(['STAFF','EMPLOYEE'].includes(role)?'./employee-v40-runtime.html':'./manager-shell.html')}document.getElementById('togglePassword').addEventListener('click',()=>{pw.type=pw.type==='password'?'text':'password'});document.getElementById('forgot').addEventListener('click',async e=>{e.preventDefault();const u=document.getElementById('username').value.trim();if(!u){setStatus('Nhập tên đăng nhập trước khi đặt lại mật khẩu.',true);return}const {data:email,error}=await sb.rpc('resolve_login_email',{p_username:u});if(error||!email){setStatus('Không tìm thấy tài khoản để đặt lại mật khẩu.',true);return}const {error:re}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});setStatus(re?'Không thể gửi email đặt lại mật khẩu.':'Đã gửi yêu cầu đặt lại mật khẩu.',!!re)});document.getElementById('register').addEventListener('click',e=>{e.preventDefault();setStatus('Vui lòng liên hệ quản lý để tạo tài khoản.',false)});form.addEventListener('submit',async e=>{e.preventDefault();const u=document.getElementById('username').value.trim(),password=pw.value;if(!u||!password){setStatus('Vui lòng nhập tên đăng nhập và mật khẩu.',true);return}btn.disabled=true;setStatus('Đang đăng nhập…',false);try{const {data:email,error:re}=await sb.rpc('resolve_login_email',{p_username:u});if(re)throw re;if(!email)throw new Error('Tên đăng nhập không tồn tại hoặc tài khoản chưa ACTIVE.');const {error:le}=await sb.auth.signInWithPassword({email,password});if(le)throw le;await route()}catch(err){setStatus(err.message||'Đăng nhập thất bại.',true);btn.disabled=false}});route()})();</script>
</body>
</html>
