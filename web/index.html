<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAGASIN | Hệ thống nội bộ</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#17243a;display:grid;place-items:center;min-height:100vh}.box{max-width:560px;margin:24px;padding:28px;border:1px solid #dbe4ef;border-radius:18px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.08)}.muted{color:#718199}a{display:inline-block;margin-top:14px;padding:11px 15px;border-radius:10px;background:#16b7c5;color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main class="box"><h1>MAGASIN</h1><p class="muted">Đang xác định giao diện theo quyền tài khoản…</p><p id="status" class="muted">Vui lòng chờ.</p><a href="./manager-shell.html">Mở hệ thống quản lý</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){'use strict';
const status=document.getElementById('status');
const sb=supabase.createClient('https://menvbzlsncmpuvnaifxa.supabase.co','sb_publishable_HsvCS6HDZnCDInd9PUoh0g_V34wJVqx',{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});
async function route(){try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data.session){status.textContent='Chưa đăng nhập. Mở hệ thống quản lý để đăng nhập.';return;}const {data:p,error:pe}=await sb.from('profiles').select('role,status').eq('id',data.session.user.id).single();if(pe)throw pe;if(String(p.status).toUpperCase()!=='ACTIVE'){status.textContent='Tài khoản chưa được kích hoạt.';return;}const role=String(p.role||'STAFF').toUpperCase();if(['STAFF','EMPLOYEE'].includes(role)){location.replace('./employee-v40.html');return;}location.replace('./manager-shell.html');}catch(e){status.textContent='Không thể xác định quyền: '+(e.message||'lỗi không xác định');}}
route();
})();
</script>
</body>
</html>
