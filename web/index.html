<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101d32">
  <title>MAGASIN | Hệ thống nội bộ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#101d32;--navy2:#17263f;--text:#172033;--muted:#778197;--bg:#f5f7fb;--white:#fff;--teal:#18c8c7;--line:#e4eaf1;--blue:#dceeff;--red:#ffe0df;--pastel:#dff4f6}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Be Vietnam Pro',Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 14% 12%,#29456c 0,transparent 32%),radial-gradient(circle at 85% 85%,#0e6169 0,transparent 31%),linear-gradient(135deg,#091426,#111f36 52%,#071827)}
    .auth-card{width:min(430px,calc(100% - 24px));padding:30px;border:1px solid #ffffff18;border-radius:22px;background:#1c2b43df;box-shadow:0 24px 70px #0006;color:#f7fbff}.brand{text-align:center;margin-bottom:22px}.logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:0 auto 12px;background:linear-gradient(145deg,#19d6d0,#0ba8c6);color:#fff;font-weight:800;font-size:27px}.brand h1{margin:0 0 5px;font-size:25px}.brand p{margin:0;color:#78dedc;font-size:13px}.auth label{display:block;margin:14px 0 7px;font-size:12px;font-weight:600;color:#d4ddeb}.auth input{width:100%;height:48px;padding:0 13px;border:1px solid transparent;border-radius:10px;outline:0;background:#f5f8ff;color:#1a2b42}.auth input:focus{border-color:var(--teal);box-shadow:0 0 0 4px #16c7c52d}.button{width:100%;height:51px;margin-top:21px;border:0;border-radius:10px;color:#fff;font-weight:700;background:linear-gradient(90deg,#0db6b4,#10b6d5)}.switch{margin:18px 0 0;text-align:center;font-size:12px;color:#bac7d7}.switch a{color:#78dedc;text-decoration:none;font-weight:600}.message{min-height:18px;margin:14px 0;text-align:center;color:#ffd193;font-size:12px}.footer{margin:20px 0 0;text-align:center;color:#8b9ab1;font-size:11px}
    .app{display:none;min-height:100vh}.app.active{display:block}.main{position:relative;min-height:100vh;background:var(--bg)}.topbar{position:sticky;top:0;z-index:1200;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:#fff;border-bottom:1px solid var(--line)}.topbar-leading{display:flex;align-items:center;gap:14px;min-width:0}.title-block{min-width:0}.topbar h2{margin:0;font-size:22px;line-height:1.2}.topbar p{margin:4px 0 0;color:var(--muted);font-size:13px}.hamburger{width:44px;height:44px;border:0;border-radius:11px;background:#f1f5f9;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:10px}.hamburger span{display:block;width:22px;height:2.5px;margin:auto;border-radius:999px;background:#172033;transition:.18s}.hamburger.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}.hamburger.open span:nth-child(2){opacity:0}.hamburger.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}.user-dot{width:36px;height:36px;border-radius:50%;background:#18c8c7}
    .drawer{position:fixed;left:0;top:72px;bottom:0;z-index:1100;width:min(320px,calc(100vw - 28px));background:var(--navy);color:#fff;transform:translateX(-102%);transition:transform .24s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;box-shadow:18px 0 42px rgba(7,17,31,.25)}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08)}.drawer-logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#19d6d0,#0ba8c6);display:grid;place-items:center;font-weight:800}.drawer-brand strong,.drawer-brand span{display:block}.drawer-brand span{margin-top:3px;color:#8fa2bd;font-size:12px}.drawer-menu{padding:14px 12px;overflow:auto;flex:1}.drawer-btn,.drawer-parent{width:100%;min-height:50px;border:0;border-radius:12px;background:transparent;color:#dbe5f1;display:flex;align-items:center;gap:12px;padding:11px 14px;text-align:left;margin-bottom:4px}.drawer-btn:hover,.drawer-parent:hover{background:rgba(255,255,255,.07);color:#fff}.drawer-btn.active{background:#0fbab825;color:#69e7e3}.drawer-parent{justify-content:space-between}.arrow{font-size:22px;transition:transform .18s}.drawer-group.open .arrow{transform:rotate(90deg)}.drawer-children{display:none;padding-left:12px}.drawer-group.open .drawer-children{display:block}.drawer-bottom{padding:12px;border-top:1px solid rgba(255,255,255,.08)}.drawer-user{display:flex;align-items:center;gap:10px;padding:8px;color:#fff}.avatar{width:40px;height:40px;border-radius:50%;background:#18c8c7;display:grid;place-items:center;font-weight:700}.drawer-user small{display:block;color:#91a2b9;margin-top:2px}.logout{width:100%;margin-top:6px;min-height:42px;border:0;border-radius:9px;background:#ffffff10;color:#c8d4e5}.overlay{position:fixed;inset:72px 0 0;z-index:1050;background:rgba(15,23,42,.48);opacity:0;visibility:hidden;pointer-events:none;transition:.22s}.overlay.active{opacity:1;visibility:visible;pointer-events:auto}
    .content{padding:32px 36px;max-width:1600px;margin:auto}.toolbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}.toolbar h1,.toolbar h2{margin:0;color:#243248}.toolbar p{margin:6px 0 0;color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.panel{padding:20px;margin-bottom:16px}
    .week-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.week-label{font-size:13px;color:#64748b;font-weight:600}.legend{display:flex;gap:12px 18px;flex-wrap:wrap;margin:14px 0;color:#607086;font-size:11px;font-weight:700}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}.dot.m{background:var(--blue)}.dot.a{background:var(--red)}.dot.e{background:var(--pastel)}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:10px;overflow:auto;padding-bottom:4px}.day{min-height:260px;padding:12px;border:1px solid #dfe7ef;border-radius:16px;background:#fbfcfe}.day.today{border-color:#18b5bd;box-shadow:0 0 0 2px rgba(24,181,189,.1)}.day-head{display:flex;flex-direction:column;gap:3px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid #e9eef3}.day-head strong{font-size:14px}.day-head span{font-size:12px;color:#7b899b}.shifts{display:flex;flex-direction:column;gap:8px}.shift{min-height:64px;border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:#1f3047}.shift.m{background:var(--blue);border:1px solid #91c9f5}.shift.a{background:var(--red);border:1px solid #f2a4a0}.shift.e{background:var(--pastel);border:1px solid #9dd8de}.empty{min-height:155px;border:1px dashed #d8e0e8;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13px;background:#fafbfd}
    .form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.field label{display:block;color:#475569;font-size:12px;font-weight:700}.field input,.field select{width:100%;margin-top:6px;min-height:48px;padding:10px 12px;border:1px solid #d7e0ea;border-radius:10px;background:#fff;color:#1e293b}.primary{min-height:44px;padding:0 16px;border:0;border-radius:10px;background:#16aebd;color:#fff;font-weight:700}.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.summary{padding:18px}.summary span{display:block;font-size:12px;color:#718096}.summary strong{display:block;margin-top:6px;font-size:24px;color:#17304f}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:11px 13px;border-bottom:1px solid #edf1f5;text-align:left;font-size:12px}.table th{background:#f7fafc;color:#475569}.setting-list{display:grid;gap:12px}.setting{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.setting .grow{flex:1}.setting strong,.setting span{display:block}.setting span{margin-top:3px;color:#8a94a5;font-size:12px}.setting .chev{font-size:22px;color:#8fa2bd}
    @media(max-width:1100px){.content{padding:28px}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:768px){.topbar{height:64px;padding:0 14px}.topbar h2{font-size:18px}.topbar p{font-size:11px}.drawer{top:64px;height:calc(100dvh - 64px);width:min(84vw,340px)}.overlay{inset:64px 0 0}.content{padding:18px 14px 24px}.form-grid{grid-template-columns:1fr}.week-grid{grid-template-columns:repeat(7,minmax(145px,1fr))}.summary-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:420px){.content{padding:14px 12px 22px}.summary-grid{grid-template-columns:1fr}.drawer{width:min(88vw,320px)}}
  </style>
</head>
<body>
<section id="auth" class="auth"><main class="auth-card"><div class="brand"><div class="logo">A</div><h1>MAGASIN</h1><p>Quản lý chuỗi cửa hàng đồ uống</p></div><form onsubmit="enterApp(event)"><label>Tên đăng nhập<input autocomplete="username" required></label><label>Mật khẩu<input type="password" autocomplete="current-password" required></label><button class="button" type="submit">Đăng nhập</button></form><p class="switch">GitHub Frontend · môi trường giao diện</p><p class="message">Bản preview hiện dùng dữ liệu mẫu, chưa kết nối API.</p><p class="footer">© 2026 MAGASIN · Hệ thống nội bộ</p></main></section>
<section id="app" class="app"><div id="overlay" class="overlay" onclick="closeDrawer()"></div><aside id="drawer" class="drawer"><div class="drawer-head"><div class="drawer-logo">A</div><div class="drawer-brand"><strong>MAGASIN</strong><span>Hệ thống nội bộ</span></div></div><nav class="drawer-menu">
<button class="drawer-btn active" data-page="dashboard"><span>🏠</span>Tổng quan</button>
<div class="drawer-group open"><button class="drawer-parent" onclick="toggleGroup(this)"><span>Công việc</span><span class="arrow">›</span></button><div class="drawer-children"><button class="drawer-btn" data-page="schedule"><span>📅</span>Lịch làm</button><button class="drawer-btn" data-page="attendance"><span>⏱️</span>Chấm công</button><button class="drawer-btn" data-page="swap"><span>🔄</span>Đổi ca</button></div></div>
<div class="drawer-group"><button class="drawer-parent" onclick="toggleGroup(this)"><span>Kho hàng</span><span class="arrow">›</span></button><div class="drawer-children"><button class="drawer-btn" data-page="inventory"><span>📦</span>Tồn hàng</button></div></div>
<div class="drawer-group"><button class="drawer-parent" onclick="toggleGroup(this)"><span>Tài khoản</span><span class="arrow">›</span></button><div class="drawer-children"><button class="drawer-btn" data-page="account"><span>👤</span>Thông tin cá nhân</button></div></div>
</nav><div class="drawer-bottom"><div class="drawer-user"><div class="avatar">T</div><div><strong>tranquocvi</strong><small>Nhân viên</small></div></div><button class="logout" onclick="logoutDemo()">Đăng xuất</button></div></aside>
<main class="main"><header class="topbar"><div class="topbar-leading"><button id="hamburger" class="hamburger" aria-label="Mở menu" onclick="toggleDrawer()"><span></span><span></span><span></span></button><div class="title-block"><h2 id="pageTitle">Tổng quan</h2><p id="pageDescription">Tổng quan hoạt động hệ thống</p></div></div><div class="user-dot"></div></header><div id="content" class="content"></div></main></section>
<script>
const META={dashboard:['Tổng quan','Tổng quan hoạt động hệ thống'],schedule:['Nhân viên','Quản lý công việc cá nhân'],attendance:['Nhân viên','Quản lý công việc cá nhân'],swap:['Nhân viên','Quản lý công việc cá nhân'],inventory:['Kho hàng','Quản lý hàng hóa và tồn kho'],account:['Tài khoản','Thông tin cá nhân và bảo mật tài khoản']};
const WEEK=[['THỨ HAI','24/08/2026'],['THỨ BA','25/08/2026'],['THỨ TƯ','26/08/2026'],['THỨ NĂM','27/08/2026'],['THỨ SÁU','28/08/2026'],['THỨ BẢY','29/08/2026'],['CHỦ NHẬT','30/08/2026']];
function enterApp(e){e.preventDefault();document.getElementById('auth').style.display='none';document.getElementById('app').classList.add('active');render('dashboard')}
function logoutDemo(){closeDrawer();document.getElementById('app').classList.remove('active');document.getElementById('auth').style.display='grid'}
function toggleDrawer(){document.getElementById('drawer').classList.toggle('open');document.getElementById('overlay').classList.toggle('active');document.getElementById('hamburger').classList.toggle('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('active');document.getElementById('hamburger').classList.remove('open')}
function toggleGroup(btn){btn.parentElement.classList.toggle('open')}
function timeOptions(){let h='<option>Chọn mốc giờ</option>';for(let i=0;i<24;i++)for(const m of ['00','30']){const v=String(i).padStart(2,'0')+':'+m;h+='<option>'+v+'</option>'}return h}
function shiftCls(v){return v.startsWith('5:')?'m':v.startsWith('12:')?'a':'e'}
function weekHtml(data,next=false){return WEEK.map((d,i)=>{const list=data[i]||[];return '<div class="day '+(i===2?'today':'')+'"><div class="day-head"><strong>'+d[0]+'</strong><span>'+d[1]+'</span></div><div class="shifts">'+(list.length?list.map(x=>'<div class="shift '+shiftCls(x.time)+'">'+x.time+(next?'<small>'+x.status+'</small>':'')+'</div>').join(''):'<div class="empty">'+(next?'Chưa đăng ký':'Chưa có ca')+'</div>')+'</div></div>'}).join('')}
function render(page){const m=META[page]||META.dashboard;document.getElementById('pageTitle').textContent=m[0];document.getElementById('pageDescription').textContent=m[1];document.querySelectorAll('.drawer-btn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='schedule')return renderSchedule();if(page==='attendance')return renderAttendance();if(page==='swap')return renderSwap();if(page==='inventory')return renderInventory();if(page==='account')return renderAccount();renderDashboard()}
document.querySelectorAll('.drawer-btn[data-page]').forEach(b=>b.addEventListener('click',()=>{render(b.dataset.page);closeDrawer()}));
function renderDashboard(){document.getElementById('content').innerHTML='<div class="toolbar"><div><h1>Chào mừng đến với MAGASIN</h1><p>Hãy chọn chức năng từ menu để bắt đầu vận hành hệ thống.</p></div></div><section class="panel card"><div class="summary-grid"><div class="summary"><span>Doanh thu hôm nay</span><strong>9.568.000đ</strong></div><div class="summary"><span>Giảm giá</span><strong>2.322.000đ</strong></div><div class="summary"><span>Số khách hàng</span><strong>382</strong></div><div class="summary"><span>Số hóa đơn</span><strong>382</strong></div></div></section>'}
function renderSchedule(){const official=[[],[],[{time:'5:00-12:00'},{time:'12:00-17:00'}],[],[],[],[]];const next=[[],[{time:'17:00-22:00',status:'Chờ duyệt'}],[{time:'5:00-12:00',status:'Đã duyệt'},{time:'17:00-22:00',status:'Quản lý xếp lịch'}],[],[],[],[]];document.getElementById('content').innerHTML='<div class="toolbar"><div><h1>Lịch làm việc</h1><p>Theo dõi lịch chính thức trong tuần và đăng ký ca cho tuần kế tiếp.</p></div></div><section class="panel card"><div class="week-head"><div><h3>Lịch làm việc trong tuần</h3><div class="week-label">24/08/2026 – 30/08/2026</div><div class="legend"><span><i class="dot m"></i>5:00–12:00</span><span><i class="dot a"></i>12:00–17:00</span><span><i class="dot e"></i>17:00–22:00</span></div></div></div><div class="week-grid">'+weekHtml(official)+'</div></section><section class="panel card"><h3>Đăng ký ca làm tuần tới</h3><p>Chỉ chọn ngày, giờ bắt đầu, giờ kết thúc và cửa hàng.</p><div class="form-grid"><div class="field"><label>Ngày<input type="date" value="2026-08-31"></label></div><div class="field"><label>Giờ bắt đầu<select>'+timeOptions()+'</select></label></div><div class="field"><label>Giờ kết thúc<select>'+timeOptions()+'</select></label></div><div class="field"><label>Cửa hàng<select><option>CN01</option><option>CN02</option></select></label></div></div><button class="primary" style="margin-top:14px">Đăng ký ca</button></section><section class="panel card"><h3>Đăng ký tuần tới</h3><p>Hiển thị chờ duyệt, đã duyệt hoặc quản lý xếp.</p><div class="week-grid">'+weekHtml(next,true)+'</div></section>'}
function renderAttendance(){document.getElementById('content').innerHTML='<div class="toolbar"><div><h1>Chấm công</h1><p>Xác nhận giờ làm và theo dõi lịch sử chấm công.</p></div></div><div class="summary-grid"><div class="summary card"><span>Tổng giờ công</span><strong>0,00</strong></div><div class="summary card"><span>Tổng tiền công</span><strong>0đ</strong></div><div class="summary card"><span>Số ca</span><strong>0</strong></div><div class="summary card"><span>Giờ công / ca</span><strong>0,00</strong></div></div><section class="panel card" style="margin-top:16px"><h3>Xác nhận chấm công</h3><div class="form-grid"><div class="field"><label>Ngày<input type="date"></label></div><div class="field"><label>Chi nhánh<select><option>CN01</option><option>CN02</option></select></label></div><div class="field"><label>Giờ vào<select>'+timeOptions()+'</select></label></div><div class="field"><label>Giờ ra<select>'+timeOptions()+'</select></label></div></div><button class="primary" style="margin-top:14px">Xác nhận chấm công</button></section><section class="panel card"><h3>Lịch sử chấm công</h3><div class="table-wrap"><table class="table"><thead><tr><th>Ngày</th><th>Chi nhánh</th><th>Giờ vào</th><th>Giờ ra</th><th>Giờ công</th><th>Trạng thái</th></tr></thead><tbody><tr><td>26/08/2026</td><td>CN01</td><td>05:30</td><td>12:00</td><td>6,50</td><td>Đã xác nhận</td></tr></tbody></table></div></section>'}
function renderSwap(){document.getElementById('content').innerHTML='<div class="toolbar"><div><h1>Đổi ca</h1><p>Gửi yêu cầu đổi ca và theo dõi trạng thái.</p></div></div><section class="panel card"><div class="form-grid"><div class="field"><label>Ca hiện tại<select><option>05:00-12:00</option><option>12:00-17:00</option><option>17:00-22:00</option></select></label></div><div class="field"><label>Ca đề nghị<select><option>12:00-17:00</option><option>17:00-22:00</option><option>05:00-12:00</option></select></label></div><div class="field"><label>Cửa hàng<select><option>CN01</option><option>CN02</option></select></label></div><div class="field"><label>Lý do<input placeholder="Nhập lý do đổi ca"></label></div></div><button class="primary" style="margin-top:14px">Gửi yêu cầu</button></section><section class="panel card"><h3>Yêu cầu đã gửi</h3><div class="table-wrap"><table class="table"><thead><tr><th>Ngày</th><th>Ca hiện tại</th><th>Ca đề nghị</th><th>Trạng thái</th></tr></thead><tbody><tr><td>31/08/2026</td><td>05:00-12:00</td><td>12:00-17:00</td><td>Chờ duyệt</td></tr></tbody></table></div></section>'}
