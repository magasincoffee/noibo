<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAGASIN · Ứng dụng nội bộ</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}#app{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" title="MAGASIN application"></iframe><script>(function(){'use strict';const frame=document.getElementById('app'),target=new URLSearchParams(location.search).get('target')==='manager'?'./manager-shell.html':'./employee-v40-runtime.html';frame.src=target;function deepest(doc){const f=doc.querySelector('iframe');return f&&f.contentDocument?deepest(f.contentDocument):doc}function injectSecurity(){try{const doc=deepest(frame.contentDocument);if(!doc)return;const src=location.origin+'/noibo/web/security-runtime.js?v=20260831-security-v2';if(!doc.querySelector('script[data-security-runtime]')){const s=doc.createElement('script');s.src=src;s.dataset.securityRuntime='1';(doc.body||doc.documentElement).appendChild(s)}let checks=0;const addEntry=()=>{const d=deepest(frame.contentDocument);if(!d)return;const exists=[...d.querySelectorAll('a,button')].some(x=>/cài đặt|bảo mật/i.test(x.textContent||''));if(!exists){const host=d.querySelector('.drawer-menu,.nav,.sidebar,.drawer');if(host){const b=d.createElement('button');b.textContent='🔐 Bảo mật';b.type='button';b.style.cssText='margin:8px 12px;width:calc(100% - 24px);padding:10px;border:1px solid #dce5f0;border-radius:10px;background:#fff;color:#536983;font-weight:700;cursor:pointer';b.addEventListener('click',()=>d.defaultView.MAGASIN_SECURITY?.open());host.appendChild(b)}}if(++checks<20)setTimeout(addEntry,250)};addEntry()}catch(e){console.warn('Security runtime injection failed',e)}}frame.addEventListener('load',()=>setTimeout(injectSecurity,300));setTimeout(injectSecurity,1000);})();</script></body></html>
