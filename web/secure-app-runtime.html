<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAGASIN · Ứng dụng nội bộ</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}#app{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" title="MAGASIN application"></iframe><script>(function(){'use strict';const frame=document.getElementById('app'),isManager=new URLSearchParams(location.search).get('target')==='manager';frame.src=isManager?'./manager-shell.html':'./employee-v40-runtime.html';function deepest(doc){const f=doc&&doc.querySelector('iframe');return f&&f.contentDocument?deepest(f.contentDocument):doc}function injectScript(doc,src,attr){if(!doc||doc.querySelector('script['+attr+']'))return;const s=doc.createElement('script');s.src=src;s.setAttribute(attr,'1');(doc.body||doc.documentElement).appendChild(s)}function injectSecurityAndOwner(){try{const doc=deepest(frame.contentDocument);if(!doc)return;const base=location.origin+'/noibo/web/';injectScript(doc,base+'security-runtime.js?v=20260831-security-v2','data-security-runtime');if(isManager){injectScript(doc,base+'owner-access-approval.js?v=20260901-owner-v1','data-owner-approval-runtime');injectScript(doc,base+'manager-auth-ui.js?v=20260901-manager-auth-ui-v1','data-manager-auth-ui');}let checks=0;const addEntry=()=>{const d=deepest(frame.contentDocument);if(!d)return;const exists=[...d.querySelectorAll('a,button')].some(x=>/cài đặt|bảo mật|phê duyệt tài khoản/i.test(x.textContent||''));if(!exists){const host=d.querySelector('.drawer-menu,.nav,.sidebar,.drawer');if(host){const b=d.createElement('button');b.textContent='🔐 Bảo mật';b.type='button';b.style.cssText='margin:8px 12px;width:calc(100% - 24px);padding:10px;border:1px solid #dce5f0;border-radius:10px;background:#fff;color:#536983;font-weight:700;cursor:pointer';b.addEventListener('click',()=>d.defaultView.MAGASIN_SECURITY?.open());host.appendChild(b)}}if(++checks<20)setTimeout(addEntry,250)};addEntry()}catch(e){console.warn('Runtime injection failed',e)}}frame.addEventListener('load',()=>setTimeout(injectSecurityAndOwner,300));setTimeout(injectSecurityAndOwner,1000);})();</script></body></html>
