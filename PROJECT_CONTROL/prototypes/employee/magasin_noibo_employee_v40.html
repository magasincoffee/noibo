<div id="load">Đang mở Employee Prototype v40…</div>
<script>
const BASE='https://raw.githubusercontent.com/magasincoffee/noibo/prototype/employee-v38-final-20260830/PROJECT_CONTROL/prototypes/employee/magasin_noibo_employee_v38.html';
const visualCss=`
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{--ui-bg:#F4F7FB;--ui-surface:#fff;--ui-text:#102A43;--ui-muted:#617793;--ui-border:#DCE5F0;--ui-primary:#16B7C5;--ui-shadow-1:0 2px 8px rgba(16,42,67,.06);--ui-shadow-2:0 8px 24px rgba(16,42,67,.14)}
html,body{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif!important;background:var(--ui-bg)!important;color:var(--ui-text)!important}header,.topbar,.app-header{background:#fff!important;border-bottom:1px solid var(--ui-border)!important;box-shadow:none!important}.panel,.card,.section-card,.module-card{background:#fff!important;border:1px solid var(--ui-border)!important;border-radius:16px!important;box-shadow:var(--ui-shadow-1)!important}h1{font-size:28px!important;line-height:1.2!important;font-weight:700!important}h2{font-size:20px!important;line-height:1.25!important;font-weight:700!important}h3{font-size:16px!important;line-height:1.3!important;font-weight:600!important}label,.label,.field-label{font-size:14px!important;color:var(--ui-muted)!important;font-weight:500!important}button,.btn,.action-button,a.btn{min-height:40px!important;border-radius:10px!important;font-family:inherit!important;font-weight:600!important;box-shadow:none!important}input,select,textarea{font-family:inherit!important;min-height:42px!important;border:1px solid var(--ui-border)!important;border-radius:10px!important}input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--ui-primary)!important;box-shadow:0 0 0 3px rgba(22,183,197,.14)!important}.dashboard-grid{gap:16px!important}.today-panel,.task-panel,.kpi-dashboard-panel,.academy-panel,.weekly-reg-panel{border-radius:16px!important;border:1px solid var(--ui-border)!important;box-shadow:var(--ui-shadow-1)!important}.task-item,.todo-item,.task-card{border:1px solid var(--ui-border)!important;border-radius:12px!important;background:#FBFCFE!important}.kpi-dashboard-panel .kpi-summary-card,.kpi-card{border:1px solid var(--ui-border)!important;border-radius:12px!important;box-shadow:none!important;background:#fff!important}.academy-card{background:#fff!important;border:1px solid var(--ui-border)!important;border-radius:12px!important;box-shadow:none!important}.acc-head{background:#EEF4FA!important;border-radius:12px!important;min-height:52px!important}.modal,.dialog,.dropdown-menu,.popover{border-radius:18px!important;box-shadow:var(--ui-shadow-2)!important;border:1px solid var(--ui-border)!important}.shift.morning-yellow,.miniShift.registration-yellow{background:#FFF9D8!important;border-color:#F0E6A3!important;color:#725F00!important}.shift.afternoon-red,.miniShift.registration-red{background:#FBE4E4!important;border-color:#EDBABA!important;color:#9A3838!important}.shift.evening-cyan,.miniShift.registration-cyan{background:#DDF8F8!important;border-color:#A3DFDF!important;color:#08777A!important}.kpi-summary-card .ring,.kpi-card .ring{transform:scale(.92)}
`;
const settingsJs=`
document.addEventListener('DOMContentLoaded',()=>{const root=document.querySelector('#view-settings');if(!root)return;const hs=[...root.querySelectorAll('h2,h3')];const h=hs.find(e=>e.textContent.trim()==='Thông báo');if(!h||root.querySelector('.settings-notification-accordion'))return;const box=document.createElement('div');box.className='settings-notification-accordion';const b=document.createElement('button');b.type='button';b.className='settings-section-toggle';b.setAttribute('aria-expanded','false');b.innerHTML='<span>🔔 Thông báo</span><span>⌄</span>';const c=document.createElement('div');c.className='settings-section-content';let n=h.nextElementSibling;while(n){const nx=n.nextElementSibling;if(/^(H2|H3|H4)$/.test(n.tagName)||n.matches('hr'))break;c.appendChild(n);n=nx}b.onclick=()=>{const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));c.classList.toggle('is-open',!open)};box.append(b,c);h.replaceWith(box)});
`;
const settingsCss=`
#view-settings .settings-section-toggle{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border:1px solid #DCE5F0;border-radius:12px;background:#F8FAFD;color:#102A43;cursor:pointer;text-align:left}#view-settings .settings-section-toggle:hover{background:#EEF4FA}#view-settings .settings-section-content{display:none;margin-top:8px}#view-settings .settings-section-content.is-open{display:block}#view-settings .settings-section-content>*{border:1px solid #DCE5F0;border-radius:10px;background:#fff;padding:12px 14px;margin-top:8px}
`;
fetch(BASE).then(r=>{if(!r.ok)throw new Error('Không tải được bản Employee v38 nền');return r.text()}).then(src=>{document.open();document.write(src);document.close();const run=()=>{const s=document.createElement('style');s.textContent=visualCss+settingsCss;document.head.appendChild(s);const j=document.createElement('script');j.textContent=settingsJs;document.body.appendChild(j)};setTimeout(run,50)}).catch(e=>{document.body.innerHTML='<div style="font:600 15px system-ui;padding:32px;color:#B34B4B">Không thể tải Employee Prototype v40: '+e.message+'</div>'});
</script>
</body>
