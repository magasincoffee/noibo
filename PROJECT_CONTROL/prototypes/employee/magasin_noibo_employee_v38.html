<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAGASIN NOIBO — Employee Prototype v38</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--line:#dfe7f1;--text:#15304f;--muted:#70839b;--blue:#2563eb;--green:#0e8a62;--yellow:#fff7a8;--red:#f5d0d0;--cyan:#c9f7f8;--shadow:0 8px 24px rgba(20,42,70,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text)}button{font:inherit;cursor:pointer}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:22px 15px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:22px;margin:4px 8px 26px}.user{padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:18px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#eaf2ff;color:var(--blue);font-weight:900;float:left;margin-right:10px}.user b{display:block;padding-top:2px}.user small{color:var(--muted)}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#47617f}.nav button.active{background:#edf4ff;color:#1858cc;font-weight:800}.main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.top h1{font-size:24px;margin:0}.top p{margin:4px 0 0;color:var(--muted);font-size:13px}.bell{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:19px}.wrap{padding:24px;max-width:1320px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.card h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted)}.today .shift{border-radius:12px;padding:13px;background:var(--yellow);border:1px solid #e8df68}.today .shift strong{display:block;margin-bottom:4px}.task{display:grid;gap:9px}.task div{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:11px}.kpiGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kpiBox{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fafcff;display:block;text-align:left;width:100%}.kpiBox .pct{font-size:31px;font-weight:900;margin:8px 0 2px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#e8f7ef;color:#0a7a55}.academy .progress{height:8px;background:#edf1f6;border-radius:99px;overflow:hidden}.academy .progress span{display:block;height:100%;width:72%;background:#276ef1}.academy .item{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.full{grid-column:1/-1}.regHead{display:flex;justify-content:space-between;align-items:center}.arrow{border:0;background:#f4f7fb;border-radius:10px;padding:8px 11px}.regBody{display:none;margin-top:14px}.regBody.open{display:block}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.day{border:1px solid var(--line);border-radius:11px;padding:9px;min-height:112px}.day b{display:block;font-size:12px}.day small{color:var(--muted)}.mini{margin-top:8px;padding:8px;border-radius:9px;font-size:11px;font-weight:800}.yellow{background:var(--yellow)}.red{background:var(--red)}.cyan{background:var(--cyan)}.pageCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.filters input,.filters select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.sum{padding:14px;border:1px solid var(--line);border-radius:12px}.sum b{font-size:22px;display:block;margin-top:4px}.settingsRow{padding:14px 0;border-bottom:1px solid var(--line)}.settingsRow button{float:right;border:0;background:#f4f7fb;padding:8px 11px;border-radius:9px}.password{display:none;margin-top:12px}.password.open{display:grid;gap:9px}.password input{padding:10px;border:1px solid var(--line);border-radius:9px}.legend{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-top:12px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center}.grid2,.kpiGrid{grid-template-columns:1fr}.full{grid-column:auto}.week{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:1fr 1fr}}@media(max-width:560px){.nav{grid-template-columns:1fr 1fr}.top{padding:0 15px}.wrap{padding:15px}.week{grid-template-columns:1fr}.summary{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">MAGASIN NOIBO</div>
  <div class="user"><div class="avatar">B</div><b>Nguyễn Văn Bình</b><small>Nhân viên · CN2</small><div style="clear:both"></div></div>
  <div class="nav">
    <button class="active" data-page="dashboard">🏠 Tổng quan</button>
    <button data-page="schedule">📅 Lịch làm</button>
    <button data-page="attendance">⏱ Chấm công</button>
    <button data-page="swap">🔄 Đổi ca</button>
    <button data-page="account">👤 Thông tin cá nhân</button>
    <button data-page="settings">⚙️ Cài đặt</button>
  </div>
  <div style="margin-top:18px;color:#9aa9ba;font-size:11px;padding:0 8px">Prototype Employee v38</div>
</aside>
<main class="main">
<header class="top"><div><h1 id="title">Tổng quan</h1><p id="desc">Tổng quan hoạt động</p></div><button class="bell" title="Thông báo">🔔</button></header>
<div class="wrap" id="content"></div>
</main>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
function setActive(page){$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
function top(title,desc){$('#title').textContent=title;$('#desc').textContent=desc}
function dashboard(){
 top('Tổng quan','Tổng quan hoạt động');
 $('#content').innerHTML=`
 <div class="grid2">
  <section class="card today"><h2>Hôm nay</h2><div class="shift"><strong>09:00–13:00 · CN2</strong><span class="muted">Ca làm hôm nay</span><div style="margin-top:10px"><button onclick="go('attendance')" style="border:0;background:#15304f;color:#fff;padding:8px 11px;border-radius:9px">⏱ Chấm công</button></div></div></section>
  <section class="card"><h2>Công việc hôm nay</h2><div class="task"><div><span>Kiểm tra khu vực quầy</span><b>✓</b></div><div><span>Nhập tồn hàng</span><b>•</b></div><div><span>Kiểm tra thiết bị</span><b>•</b></div></div></section>
  <section class="card"><h2>KPI tháng này</h2><div class="kpiGrid"><button class="kpiBox" onclick="kpiDetail('personal')"><span class="muted">KPI cá nhân</span><div class="pct">95%</div><span class="pill">Tốt</span></button><button class="kpiBox" onclick="kpiDetail('store')"><span class="muted">KPI cửa hàng · CN2</span><div class="pct">98%</div><span class="pill">Gần đạt</span></button></div><div style="margin-top:10px;font-size:12px;color:#70839b">Bấm vào % để xem chi tiết mục tiêu, thực tế và phần còn thiếu.</div></section>
  <section class="card academy"><h2>Academy</h2><div style="display:flex;justify-content:space-between;font-size:12px"><b>Cấp 2</b><b>72%</b></div><div class="progress" style="margin:8px 0 12px"><span></span></div><div class="item"><b>Hoàn thành quy trình order</b><br><span class="muted">Đã hoàn thành</span></div><div class="item"><b>Quy trình tồn hàng</b><br><span class="muted">Đang học</span></div><div class="item"><b>Kỹ năng quản lý ca</b><br><span class="muted">Chưa bắt đầu</span></div></section>
  <section class="card full"><div class="regHead"><div><h2 style="margin-bottom:4px">Đăng ký lịch làm tuần tới</h2><span class="muted">Chọn thời gian bạn có thể làm</span></div><button class="arrow" onclick="this.parentElement.parentElement.querySelector('.regBody').classList.toggle('open')">⌄</button></div><div class="regBody"><div class="week"><div class="day"><b>T2</b><small>01/09</small><div class="mini yellow">06:00–14:00</div></div><div class="day"><b>T3</b><small>02/09</small><div class="mini red">12:00–17:00</div></div><div class="day"><b>T4</b><small>03/09</small><div class="mini cyan">14:00–22:00</div></div><div class="day"><b>T5</b><small>04/09</small><div class="mini yellow">06:00–14:00</div></div><div class="day"><b>T6</b><small>05/09</small><div class="mini red">12:00–17:00</div></div><div class="day"><b>T7</b><small>06/09</small><div class="mini cyan">14:00–22:00</div></div><div class="day"><b>CN</b><small>07/09</small><div class="mini yellow">06:00–14:00</div></div></div><div class="legend"><span>🟨 06:00–14:00</span><span>🟥 12:00–17:00</span><span>🟦 14:00–22:00</span></div></div></section>
 </div>`;
}
function schedule(){top('Lịch làm','Lịch làm việc cá nhân');$('#content').innerHTML=`<section class="pageCard"><button class="back" onclick="go('dashboard')">← Quay lại Tổng quan</button><h2 style="margin:0 0 14px">Lịch làm của tôi</h2><div class="week"><div class="day"><b>T2 · 01/09</b><div class="mini yellow">06:00–14:00<br>CN2</div></div><div class="day"><b>T3 · 02/09</b><div class="mini red">12:00–17:00<br>CN2</div></div><div class="day"><b>T4 · 03/09</b><div class="mini cyan">14:00–22:00<br>CN2</div></div><div class="day"><b>T5 · 04/09</b><div class="mini yellow">06:00–14:00<br>CN2</div></div><div class="day"><b>T6 · 05/09</b><div class="mini red">12:00–17:00<br>CN2</div></div><div class="day"><b>T7 · 06/09</b><div class="mini cyan">14:00–22:00<br>CN2</div></div><div class="day"><b>CN · 07/09</b><div class="mini yellow">06:00–14:00<br>CN2</div></div></div></section><section class="pageCard" style="margin-top:16px"><div class="regHead"><div><h2 style="margin:0 0 4px">📅 Đăng ký lịch làm tuần tiếp theo</h2><span class="muted">Card riêng, giữ phần mở rộng bằng mũi tên</span></div><button class="arrow" onclick="this.parentElement.parentElement.querySelector('.regBody').classList.toggle('open')">⌄</button></div><div class="regBody"><p class="muted">Chọn khoảng giờ có thể làm cho từng ngày.</p><div class="week"><div class="day"><b>T2</b><div class="mini yellow">06:00–14:00</div></div><div class="day"><b>T3</b><div class="mini red">12:00–17:00</div></div><div class="day"><b>T4</b><div class="mini cyan">14:00–22:00</div></div><div class="day"><b>T5</b><div class="mini yellow">06:00–14:00</div></div><div class="day"><b>T6</b><div class="mini red">12:00–17:00</div></div><div class="day"><b>T7</b><div class="mini cyan">14:00–22:00</div></div><div class="day"><b>CN</b><div class="mini yellow">06:00–14:00</div></div></div></div></section>`}
function attendance(){top('Chấm công','Giờ công và thu nhập');$('#content').innerHTML=`<section class="pageCard"><div class="filters"><input type="date" value="2026-08-01"><input type="date" value="2026-08-31"><button style="border:0;background:#2563eb;color:#fff;padding:10px 13px;border-radius:10px">Áp dụng</button></div><div class="summary"><div class="sum"><span class="muted">Tổng ca</span><b>24</b></div><div class="sum"><span class="muted">Tổng giờ công</span><b>168h</b></div><div class="sum"><span class="muted">Tổng tiền nhận</span><b>6.720.000đ</b></div><div class="sum"><span class="muted">TB / giờ</span><b>40.000đ</b></div></div><table class="table"><thead><tr><th>Ngày</th><th>Ca</th><th>Giờ</th><th>Trạng thái</th></tr></thead><tbody><tr><td>28/08</td><td>CN2</td><td>09:00–13:00</td><td>Đã công</td></tr><tr><td>27/08</td><td>CN2</td><td>14:00–22:00</td><td>Đã công</td></tr></tbody></table></section>`}
function kpiDetail(type){top(type==='personal'?'KPI cá nhân':'KPI cửa hàng · CN2','Chi tiết KPI');$('#content').innerHTML=`<button class="back" onclick="go('dashboard')">← Quay lại Tổng quan</button><section class="pageCard"><h2>${type==='personal'?'KPI cá nhân':'KPI cửa hàng · CN2'}</h2><p class="muted">Mỗi chỉ tiêu hiển thị Thực tế · Mục tiêu · % đạt. ${type==='personal'?'Có thể hiện vi phạm và nội dung còn thiếu.':'Tập trung vào kết quả tập thể.'}</p><div class="summary"><div class="sum"><span class="muted">Điểm tổng</span><b>${type==='personal'?'95%':'98%'}</b></div><div class="sum"><span class="muted">Mục tiêu</span><b>100%</b></div><div class="sum"><span class="muted">Đạt</span><b>${type==='personal'?'5':'6'}</b></div><div class="sum"><span class="muted">${type==='personal'?'Cần chú ý':'Còn thiếu'}</span><b>${type==='personal'?'1':'2'}</b></div></div>${type==='personal'?'<div class="task"><div><span>Đúng giờ · 96% / ≥95%</span><b>✓</b></div><div><span>Hoàn thành công việc · 94% / ≥95%</span><b>⚠</b></div><div><span>Vi phạm 05/08 · Quên xác nhận tồn hàng</span><b>!</b></div></div>':'<table class="table"><tr><th>Chỉ tiêu</th><th>Thực tế</th><th>Mục tiêu</th><th>Đạt</th></tr><tr><td>Doanh thu</td><td>49tr</td><td>50tr</td><td>98%</td></tr><tr><td>Đơn hàng</td><td>2.350</td><td>2.500</td><td>94%</td></tr><tr><td>SOP</td><td>97%</td><td>95%</td><td>102%</td></tr></table>'}</section>`}
function settings(){top('Cài đặt','Cài đặt tài khoản');$('#content').innerHTML=`<section class="pageCard"><div class="settingsRow"><b>🔐 Đổi mật khẩu</b><button onclick="this.parentElement.querySelector('.password').classList.toggle('open')">Mở</button><div class="password"><input placeholder="Mật khẩu hiện tại" type="password"><input placeholder="Mật khẩu mới" type="password"><input placeholder="Nhập lại mật khẩu" type="password"><button style="border:0;background:#2563eb;color:#fff;padding:10px;border-radius:9px">Cập nhật mật khẩu</button></div></div><div class="settingsRow"><b>🔔 Thông báo</b><span class="muted">Quản lý tùy chọn thông báo</span></div></section>`}
function account(){top('Thông tin cá nhân','Hồ sơ tài khoản');$('#content').innerHTML=`<section class="pageCard"><h2>Nguyễn Văn Bình</h2><p class="muted">Nhân viên · CN2</p><p>Điện thoại: 0900 000 000</p><p>Email: binh@magasin.local</p></section>`}
function go(page){setActive(page);({dashboard,schedule,attendance,settings,account,swap:()=>{top('Đổi ca','Yêu cầu đổi ca');$('#content').innerHTML='<section class="pageCard"><h2>Đổi ca</h2><p class="muted">Prototype luồng yêu cầu đổi ca.</p></section>'}})[page]()}
$$('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));dashboard();
</script>
</body>
</html>
