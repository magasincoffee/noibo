<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAGASIN NOIBO — Manager</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#f4f7fb;--w:#fff;--t:#10213b;--m:#708198;--b:#dfe6ef;--p:#16b7c5;--g:#2d9665;--r:#b34b4b;--y:#876900;--yb:#fff6d8;--rb:#fbeaea;--cb:#e0f8f8;--bb:#e9f1ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Inter,system-ui,sans-serif}.h{height:68px;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.hl{display:flex;align-items:center;gap:14px}.menu{width:42px;height:42px;border:0;border-radius:10px;background:#eef3f8;font-size:21px;cursor:pointer}.pt{font-size:20px;font-weight:700}.ps{font-size:14px;color:var(--m)}.hr{display:flex;gap:10px;align-items:center}.bell{border:0;background:transparent;font-size:18px}.av{width:36px;height:36px;border:0;border-radius:50%;background:#18b7c5;color:#fff;font-weight:700}.dr{position:fixed;inset:0 auto 0 0;width:290px;background:#10213b;color:#fff;z-index:30;transform:translateX(-100%);transition:.2s;padding:22px 16px;box-shadow:8px 0 28px rgba(0,0,0,.15)}.dr.open{transform:none}.back{position:fixed;inset:0;background:#10213b4d;z-index:25;opacity:0;visibility:hidden}.back.open{opacity:1;visibility:visible}.brand{font-size:23px;font-weight:700;padding:0 8px}.sub{font-size:12px;color:#aec0d7;padding:3px 8px 22px}.nav{display:grid;gap:6px}.nav button{width:100%;padding:12px 13px;border:0;border-radius:10px;background:transparent;color:#dce7f5;text-align:left;font:600 14px Inter;cursor:pointer}.nav button.active,.nav button:hover{background:#1b3558;color:#5fe0e5}.foot{position:absolute;left:22px;right:22px;bottom:20px;border-top:1px solid #263c59;padding-top:12px;font-size:12px}.main{min-width:0}main{padding:24px;max-width:1550px;margin:auto}.view{display:none}.view.active{display:block}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--b);border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(16,42,67,.05)}.muted{color:var(--m);font-size:13px;margin-top:6px}.list{display:grid;gap:8px}.i{padding:12px 13px;border:1px solid var(--b);border-radius:12px;background:#fbfcfe}.title{font-weight:600;font-size:13px}.meta{font-size:12px;color:var(--m);margin-top:4px}.btn{min-height:40px;padding:0 13px;border:1px solid var(--b);border-radius:10px;background:#fff;color:var(--t);font:600 13px Inter;cursor:pointer}.p{background:var(--p);color:#fff;border-color:var(--p)}.gh{background:#eef4fa}.danger{color:var(--r);border-color:#edc7c7}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:700}.bg{background:#e6f4ed;color:var(--g)}.by{background:var(--yb);color:var(--y)}.bb{background:var(--bb);color:#2f6fde}.br{background:var(--rb);color:var(--r)}.progress{height:8px;background:#eaf0f5;border-radius:999px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--p)}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--b);margin:16px 0}.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--m);padding:10px 13px;font:600 13px Inter;cursor:pointer}.tabs button.active{color:#08777a;border-color:var(--p)}.days{display:grid;grid-template-columns:repeat(7,minmax(155px,1fr));gap:8px;overflow:auto}.day{border:1px solid var(--b);border-radius:14px;overflow:hidden;background:#fff}.dh{padding:10px;background:#f8fafd;font-weight:600}.dh small{display:block;color:var(--m);font-weight:400}.sh{margin:8px;padding:8px;border:1px solid;border-radius:8px;font-size:11px}.y{background:#fff9d8;border-color:#f0e6a3;color:#725f00}.r{background:#fbe4e4;border-color:#edbaba;color:#9a3838}.c{background:#ddf8f8;border-color:#a3dfdf;color:#08777a}.reg{margin-top:10px;border:1px solid var(--b);border-radius:12px;overflow:hidden}.rh,.rf{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;background:#f8fafd}.rf{border-top:1px solid #eef2f6;background:#fff;font-size:11px;color:#708198}.rg{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));overflow:auto}.rd{padding:8px;border-right:1px solid #eef2f6;min-height:90px}.rs{display:block;width:100%;margin-top:6px;padding:7px;border:1px solid;border-radius:7px;font-size:10px}.auto{display:none;margin-top:10px;padding:12px;border:1px solid #c9daf6;background:#f4f8fe;border-radius:10px}.autog,.pub,.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.pub,.sgrid{grid-template-columns:repeat(4,1fr)}.stat{padding:10px;border:1px solid var(--b);border-radius:10px;background:#fff}.stat span{display:block;color:var(--m);font-size:10px}.stat b{display:block;font-size:20px;margin-top:3px}.tw{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px;border-bottom:1px solid #eef2f6;text-align:left;font-size:12px}.table th{background:#f8fafd;color:var(--m)}.week{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:9px;overflow:auto}.att{margin:9px;padding:9px;border:1px solid var(--b);border-radius:10px;background:#fbfcfe;font-size:11px}.att.over{border-color:#e8b8b8;background:#fff5f5}.modal{display:none;position:fixed;inset:0;background:#0f233758;z-index:50;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{width:min(820px,100%);background:#fff;padding:20px;border-radius:16px}.sgrid{margin-top:12px}.sbox{padding:12px;border:1px solid var(--b);border-radius:10px;background:#fbfcfe}.slabel{font-size:10px;color:var(--m);font-weight:700}.sval{font-size:12px;font-weight:600;margin-top:5px;line-height:1.35}@media(max-width:950px){.g4,.pub,.sgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){main{padding:16px}.g2,.g4,.pub,.sgrid,.autog{grid-template-columns:1fr}.ps{display:none}.dr{width:252px}}
</style></head><body>
<div id="back" class="back" onclick="closeMenu()"></div><aside id="drawer" class="dr"><div class="brand">MAGASIN</div><div class="sub">NOIBO · Quản lý</div><nav id="nav" class="nav"></nav><div class="foot"><b>Nguyễn Minh</b><br>Quản lý · CN2</div></aside>
<header class="h"><div class="hl"><button class="menu" onclick="toggleMenu()">☰</button><div><div class="pt" id="pt">Tổng quan</div><div class="ps" id="ps">Điều hành cửa hàng · CN2</div></div></div><div class="hr"><button class="bell">🔔</button><button class="av">M</button></div></header><main id="app"></main>
<div id="modal" class="modal"><div class="box"><div class="row"><div><h2 id="mt">Chi tiết</h2><div id="mx" class="muted"></div></div><button class="btn gh" onclick="closeModal()">Đóng</button></div></div></div>
<div id="staffmodal" class="modal"><div class="box"><div class="row"><div><h2 id="sn">Nhân viên</h2><div id="sm" class="muted"></div></div><button class="btn gh" onclick="closeStaff()">Đóng</button></div><div id="sg" class="sgrid"></div></div></div>
<script>
const N={dashboard:['Tổng quan','Điều hành cửa hàng · CN2'],staff:['Nhân sự','Nhân viên và trạng thái làm việc'],workforce:['Workforce','Nhu cầu nhân sự và lịch nháp'],schedule:['Lịch làm','Lịch chính thức của cửa hàng'],tasks:['Công việc','Giao và theo dõi công việc'],kpi:['KPI','Kết quả cửa hàng và nhân sự'],swap:['Đổi ca','Review và xử lý request đổi ca'],attendance:['Chấm công','Giờ công và thu nhập'],academy:['Academy','Năng lực và đào tạo'],settings:['Cài đặt','Tài khoản quản lý']},days=['T2','T3','T4','T5','T6','T7','CN'],dates=['31/08','01/09','02/09','03/09','04/09','05/09','06/09'];Object.entries(N).forEach(([k,v])=>{if(k!=='days'&&k!=='dates')nav.innerHTML+=`<button data-v="${k}">${k==='dashboard'?'🏠':k==='staff'?'👥':k==='workforce'?'📅':k==='schedule'?'🗓':k==='tasks'?'✅':k==='kpi'?'📊':k==='swap'?'🔄':k==='attendance'?'⏱':k==='academy'?'🎓':'⚙️'} ${v[0]}</button>`});
function dg(fn){return days.map((d,i)=>`<div class="day"><div class="dh">${d}<small>${dates[i]}</small></div>${fn(i)}</div>`).join('')}
function shifts(i){return `<div class="sh y"><b>06:00–14:00</b>CN2 · ${i==5?5:4} người</div><div class="sh r"><b>12:00–17:00</b>CN2 · ${i==5?5:4} người</div><div class="sh c"><b>14:00–22:00</b>CN2 · ${i==5?5:4} người</div>`}
function regs(n,scope,status){return `<div class="reg"><div class="rh"><div><b>${n}</b><div class="muted">${scope}</div></div><span class="badge ${status==='Đã xếp'?'bg':status==='Cần review'?'by':'br'}">${status}</span></div><div class="rg">${days.map((d,i)=>`<div class="rd"><b>${d}</b><div class="meta">${dates[i]}</div>${i==2?'<div class="meta">Nghỉ</div>':`<button class="rs ${i%3==0?'y':i%3==1?'c':'r'}">${i%3==0?'06:00–14:00':i%3==1?'14:00–22:00':'12:00–17:00'}<br>${n==='Minh Anh'?'CN1':'CN2'}</button>`}</div>`).join('')}</div><div class="rf"><span>Đăng ký tuần</span><button class="btn gh" onclick="openModal('Chỉnh sửa đăng ký','${n} · Manager có thể đổi khung giờ trước khi tạo lịch DRAFT.')">Chỉnh sửa đăng ký</button></div></div>`}
const V={
dashboard:()=>`<section><section class="card"><div class="row"><div><h2>Hiệu suất cửa hàng</h2><div class="muted">Kết quả hiện tại so với mục tiêu</div></div><button class="btn gh" onclick="go('kpi')">Xem KPI</button></div><div class="g4" style="margin-top:12px">${[['Doanh thu','49,2tr / 50tr',98],['Đơn hàng','2.410 / 2.500',96],['Đúng ca','97% / ≥95%',97],['Đánh giá khách','4,7 / 5',94]].map(x=>`<div class="i"><div class="title">${x[0]}</div><div class="meta">${x[1]}</div><div class="progress"><i style="width:${x[2]}%"></i></div></div>`).join('')}</div></section><div class="g2" style="margin-top:16px"><section class="card"><h2>Hôm nay · CN2</h2><div class="muted">Thứ Bảy · 29/08/2026</div>${['06:00–12:00 · 5/5 người','12:00–17:00 · 4/4 người','17:00–22:00 · 4/5 người'].map(x=>`<div class="i" style="margin-top:8px">${x}</div>`).join('')}</section><section class="card"><h2>Việc cần xử lý</h2>${['1 request đổi ca chờ duyệt','3 nhân viên chưa đăng ký availability','2 công việc cuối ca chưa hoàn tất'].map(x=>`<div class="i" style="margin-top:8px">${x}</div>`).join('')}</section></div></section>`,
staff:()=>`<section class="card"><div class="row"><div><h2>Nhân sự</h2><div class="muted">Danh sách nhân sự, trạng thái vận hành và các điểm cần xử lý</div></div><button class="btn p">+ Thêm nhân viên</button></div><div class="tw" style="margin-top:16px"><table class="table"><thead><tr><th>Nhân viên</th><th>Cấp</th><th>Trạng thái</th><th>KPI</th><th>Academy</th><th>Tình trạng</th><th></th></tr></thead><tbody>${[['Trắng','2','Đang làm','95%','72%','✓ Bình thường'],['Mai Chi','2','Đang làm','98%','81%','⚠ Đổi ca'],['Minh Anh','1','Nghỉ','89%','55%','⚠ Cần chú ý']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td><button class="btn gh" onclick="staff('${r[0]}')">Chi tiết</button></td></tr>`).join('')}</tbody></table></div></section>`,
workforce:()=>`<section><h2>Workforce</h2><div class="muted">Kiểm tra đăng ký lịch, xếp lịch và hoàn thiện lịch tuần</div><div class="tabs"><button class="a" data-wf="demand">Nhu cầu nhân sự</button><button data-wf="review">Lịch đăng ký &amp; review</button><button data-wf="publish">Phát hành lịch</button></div><section id="wf-demand" class="card"><h2>Nhu cầu nhân sự</h2><div class="muted">CN2 chính · CN1 hỗ trợ</div><div class="days" style="margin-top:12px">${dg(shifts)}</div></section><section id="wf-review" class="card" style="display:none"><div class="row"><div><h2>Lịch đăng ký &amp; review</h2><div class="muted">Toàn bộ đăng ký trong tuần · CN2 chính và CN1 hỗ trợ</div></div><button class="btn p" onclick="toggleAuto()">⚡ Tự động xếp lịch</button></div><div id="autos" class="auto"><b>Kiểm tra xếp lịch</b><div class="autog"><div class="stat"><span>Đã xếp</span><b>14</b></div><div class="stat"><span>Chưa xếp</span><b>4</b></div><div class="stat"><span>Coverage</span><b>94%</b></div></div><div style="margin-top:8px"><button class="btn gh">Kiểm tra đã xếp</button> <button class="btn gh">Kiểm tra chưa xếp</button></div></div>${reg('Trắng','Cấp 2 · CN2 · Chính','Đã xếp')}${reg('Mai Chi','Cấp 2 · CN2 · Chính','Cần review')}${reg('Minh Anh','Cấp 1 · CN1 · Hỗ trợ','Chưa xếp')}</section><section id="wf-publish" class="card" style="display:none"><div class="row"><div><h2>Phát hành lịch</h2><div class="muted">Lịch đã qua review và sẵn sàng Publish</div></div><span class="badge bg">REVIEWED</span></div><div class="pub"><div class="stat"><span>Coverage</span><b>96%</b></div><div class="stat"><span>Skill coverage</span><b>93%</b></div><div class="stat"><span>Cảnh báo</span><b>0</b></div><div class="stat"><span>Nhân sự</span><b>18/18</b></div></div><div class="i" style="margin-top:12px">Manager có quyền Publish lịch trong phạm vi cửa hàng được phân quyền.</div><button class="btn p" style="margin-top:12px" onclick="openModal('Publish lịch','Sau kiểm tra cuối, lịch sẽ trở thành lịch chính thức.')">Publish lịch</button></section></section>`,
schedule:()=>`<section class="card"><h2>Lịch làm của cửa hàng</h2><div class="muted">CN2 · Tuần 31/08–06/09</div><div class="days" style="margin-top:12px">${dg(()=>'<div class="sh y"><b>06:00–12:00</b>Trắng</div><div class="sh r"><b>12:00–17:00</b>Mai Chi</div><div class="sh c"><b>17:00–22:00</b>Minh Anh</div>')}</div></section>`,
tasks:()=>`<section class="card"><h2>Công việc</h2><div class="i" style="margin-top:12px">Kiểm tra tồn hàng cuối ca · Trắng</div><div class="i" style="margin-top:8px">Vệ sinh máy dập nắp · Minh Anh</div></section>`,
kpi:()=>`<section class="card"><h2>KPI cửa hàng &amp; nhân sự</h2><div class="g4" style="margin-top:12px">${[['Doanh thu','98%'],['Đơn hàng','96%'],['Đúng ca','97%'],['Review','94%']].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></section>`,
swap:()=>`<section class="card"><h2>Yêu cầu đổi ca</h2><div class="i" style="margin-top:12px"><b>Trắng ↔ Mai Chi</b><div class="meta">T5 06:00–12:00 ↔ T7 12:00–17:00 · 6 giờ ↔ 5 giờ</div><button class="btn gh">Review</button> <button class="btn p">Duyệt</button></div></section>`,
attendance:()=>`<section class="card"><h2>Chấm công</h2><div class="muted">Theo dõi giờ công và thu nhập từng nhân viên theo tuần</div><div class="week" style="margin-top:12px">${days.map((d,i)=>`<div class="day"><div class="dh">${d}<small>${dates[i]}</small></div><div class="att"><b>Trắng</b><br>5.0 giờ · 80.000đ</div><div class="att ${i==3?'over':''}"><b>Mai Chi${i==3?' · vượt giờ':''}</b><br>${i==3?'6.0 giờ · 96.000đ':'5.0 giờ · 80.000đ'}${i==3?'<br><button class="btn gh" style="margin-top:6px">Sửa</button> <button class="btn danger">Xóa</button>':''}</div></div>`).join('')}</div><div class="g4" style="margin-top:12px">${[['Tổng nhân viên','3'],['Tổng giờ','46 giờ'],['Tổng tiền','736.000đ'],['Bất thường','1']].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></section>`,
academy:()=>`<section class="card"><h2>Academy</h2><div class="muted">Theo dõi năng lực và tiến độ đào tạo</div></section>`,
settings:()=>`<section class="card"><h2>Cài đặt</h2><div class="muted">Cài đặt tài khoản quản lý</div></section>`};
function render(v){app.innerHTML='<section class="view active">'+V[v]().replace(/^<section>/,'').replace(/<\/section>$/,'')+'</section>';pt.textContent=N[v][0];ps.textContent=N[v][1];document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(v==='workforce'){document.querySelectorAll('[data-wf]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-wf]').forEach(x=>x.classList.remove('active'));b.classList.add('active');['demand','review','publish'].forEach(k=>document.getElementById('wf-'+k).style.display=k===b.dataset.wf?'block':'none')})}}function go(v){render(v);closeMenu();scrollTo(0,0)}function toggleMenu(){drawer.classList.toggle('open');back.classList.toggle('open')}function closeMenu(){drawer.classList.remove('open');back.classList.remove('open')}function openModal(t,x){mt.textContent=t;mx.textContent=x;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function toggleAuto(){autos.style.display=autos.style.display==='block'?'none':'block'}function staff(n){openModal('Hồ sơ vận hành · '+n,'Lịch làm · Chấm công · KPI · Công việc · Academy · Đổi ca · Vi phạm')}function closeStaff(){staffmodal.classList.remove('open')}nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));go('dashboard');
</script></body></html>
