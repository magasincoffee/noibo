<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAGASIN NOIBO — Lịch làm V1</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#f4f7fb;--surface:#fff;--text:#102a43;--muted:#617793;--border:#dce5f0;--yellow:#fff9d8;--yellowb:#f0e6a3;--yellowt:#725f00;--red:#fbe4e4;--redb:#edbaba;--redt:#9a3838;--cyan:#ddf8f8;--cyanb:#a3dfdf;--cyant:#08777a;--primary:#16b7c5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,system-ui,sans-serif;color:var(--text)}header{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0}.menu{width:42px;height:42px;border:0;border-radius:10px;background:#eef3f8;font-size:21px}.title{font-size:20px;font-weight:700}.sub{font-size:12px;color:var(--muted)}main{max-width:1500px;margin:auto;padding:24px}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,select{height:40px;border:1px solid var(--border);border-radius:10px;background:#fff;padding:0 12px;font:600 13px Inter;color:var(--text)}.card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 2px 8px #102a4310;padding:18px;margin-top:16px}.week{font-size:18px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:10px;overflow:auto}.day{min-width:190px;border:1px solid var(--border);border-radius:14px;overflow:hidden}.dh{padding:11px;background:#f8fafd;border-bottom:1px solid #eef2f6}.dh strong,.dh span{display:block}.dh span{font-size:11px;color:var(--muted);margin-top:3px}.shift{display:block;width:calc(100% - 12px);margin:7px 6px;padding:10px;border:1px solid;border-radius:10px;text-align:left;cursor:pointer;font:500 11px Inter}.shift b{display:block;font-size:12px}.shift span{display:block;margin-top:4px;font-weight:700}.shift em{display:block;margin-top:3px;font-size:10px;font-style:normal}.yellow{background:var(--yellow);border-color:var(--yellowb);color:var(--yellowt)}.red{background:var(--red);border-color:var(--redb);color:var(--redt)}.cyan{background:var(--cyan);border-color:var(--cyanb);color:var(--cyant)}.support{box-shadow:inset 3px 0 #2f6fde}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.m{background:#eadb60}.r{background:#e9a5a5}.c{background:#7dd7d7}.modalbg{position:fixed;inset:0;background:#0f23375e;display:none;align-items:center;justify-content:center;padding:20px}.modalbg.open{display:flex}.modal{width:min(460px,100%);background:#fff;border-radius:18px;border:1px solid var(--border);padding:22px;box-shadow:0 18px 50px #102a4330}.detail{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.detail div{padding:12px;border:1px solid #edf1f5;border-radius:10px;background:#fbfcfe}.detail span{display:block;color:var(--muted);font-size:10px}.detail strong{display:block;margin-top:4px}@media(max-width:650px){.detail{grid-template-columns:1fr}}
</style></head><body><header><button class="menu">☰</button><div><div class="title">Lịch làm</div><div class="sub">Lịch chính thức đã được Manager sắp xếp và phát hành</div></div></header><main><div class="toolbar"><div><div class="week" id="week">Tuần 31/08–06/09</div><div class="sub">Thứ Hai → Chủ Nhật · Chỉ hiển thị lịch chính thức</div></div><div class="actions"><select><option>Tất cả cửa hàng</option><option>CN1</option><option>CN2</option></select><button class="btn">← Tuần trước</button><button class="btn">Tuần này</button><button class="btn">Tuần sau →</button></div></div><section class="card"><div class="grid" id="calendar"></div><div class="legend"><span><i class="dot m"></i>06:00–14:00</span><span><i class="dot r"></i>12:00–17:00</span><span><i class="dot c"></i>14:00–22:00</span><span>Nhấp ca để xem chi tiết</span></div></section></main><div class="modalbg" id="modal"><div class="modal"><div class="toolbar"><div><h2 id="name">Nhân viên</h2><div class="sub">Chi tiết ca chính thức · chỉ xem</div></div><button class="btn" onclick="closeModal()">×</button></div><div class="detail"><div><span>NGÀY</span><strong id="date">—</strong></div><div><span>GIỜ LÀM</span><strong id="time">—</strong></div><div><span>CHI NHÁNH THỰC TẾ</span><strong id="store">—</strong></div><div><span>TRẠNG THÁI</span><strong>Đã phát hành</strong></div></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn" onclick="closeModal()">Đóng</button></div></div></div><script>const days=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'],dates=['31/08','01/09','02/09','03/09','04/09','05/09','06/09'];const shifts=[['06:00–14:00','Mai Chi · CN2','yellow'],['06:00–14:00','Minh Anh · CN1','yellow support'],['12:00–17:00','Trắng · CN2','red'],['06:00–14:00','Trắng · CN2','yellow'],['14:00–22:00','Mai Chi · CN2','cyan support'],['14:00–22:00','Minh Anh · CN1','cyan'],['06:00–14:00','Mai Chi · CN2','yellow'],['12:00–17:00','Trắng · CN2','red'],['06:00–14:00','Minh Anh · CN1','yellow support'],['12:00–17:00','Mai Chi · CN2','red'],['06:00–14:00','Trắng · CN2','yellow'],['14:00–22:00','Mai Chi · CN2','cyan support'],['06:00–14:00','Trắng · CN2','yellow'],['12:00–17:00','Mai Chi · CN2','red'],['06:00–14:00','Minh Anh · CN1','yellow support'],['06:00–14:00','Trắng · CN2','yellow'],['14:00–22:00','Minh Anh · CN1','cyan support']];let k=0;calendar.innerHTML=days.map((d,i)=>{let n=i===0?3:i===1?3:i===2?2:i===3?2:i===4?2:i===5?3:2;let h='<article class="day"><div class="dh"><strong>'+d+'</strong><span>'+dates[i]+'</span></div>';for(let j=0;j<n;j++){const s=shifts[k++];h+='<button class="shift '+s[2]+'" onclick="openModal(\''+s[1].split(' · ')[0]+'\',\''+d+' · '+dates[i]+'\',\''+s[0]+'\',\''+(s[2].includes('support')?'CN2':s[1].split(' · ')[1])+'\')"><b>'+s[0]+'</b><span>'+s[1]+'</span>'+(s[2].includes('support')?'<em>Hỗ trợ CN2</em>':'')+'</button>'}return h+'</article>'}).join('');function openModal(n,d,t,s){name.textContent=n;date.textContent=d;time.textContent=t;store.textContent=s;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});</script></body></html>
